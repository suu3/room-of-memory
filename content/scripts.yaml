# 대사 스크립트: 기억을 조사할 때 대사창에 흐르는 줄.
#
# memories.yaml의 script / resultScript가 여기 id를 가리킨다.
# 어디서도 가리키지 않는 스크립트는 죽은 대사라 `pnpm content:build`가 막는다.
#
# 한 줄의 형태:
#   speaker     화자 id. 이름은 i18n의 characters.<id>.name (memory-room.base.json).
#               hero=한도해, broadcast=긴급 재난 방송, signal=???, narrator=기록
#   expression  초상 표정. neutral(기본) | smile | surprised.
#               hero가 아닌 화자는 초상이 없어서 무시된다.
#   ko/en/ja    본문. 셋 다 있어야 한다. 마크업·이스케이프 금지.
#
# 여러 줄 대사는 YAML 블록(>-)이 아니라 한 줄로 쓴다. 줄바꿈은 대사창이 알아서 한다.

scripts:
  # 강도 1 대사는 발랄하게: 재난·고립의 힌트를 여기서 흘리지 않는다.
  # 어두워지는 건 강도 2(균열)부터, 반전은 라디오 한 곳이 갖는다.
  ball-intro:
    - speaker: hero
      expression: smile
      ko: 그 날 시합, 진짜 엄청났었지.
      en: That game that day. It was something else.
      ja: あの日の試合、ほんとにすごかったよな。
    - speaker: hero
      expression: smile
      ko: 폼 안 죽었는지 한번 볼까?
      en: Let's see if I've still got my swing.
      ja: フォームがなまってないか、試してみるか。

  # 액자를 다 닦은 뒤의 결과 대사 (1차)
  frame-photo:
    - speaker: hero
      expression: smile
      ko: 이건 유소년 야구대회에서 입상했을 때의 사진이야.
      en: This is from the youth baseball tournament, the day I placed.
      ja: これ、少年野球の大会で入賞したときの写真だ。
    - speaker: hero
      ko: …지금 어디 계실까?
      en: …Where are they right now?
      ja: …今、どこにいるんだろう。

  # 2차 조사에서 가족 얼굴이 드러난 뒤의 결과 대사
  frame-photo-echo:
    - speaker: hero
      expression: surprised
      ko: …부모님 얼굴, 이제야 제대로 보이네.
      en: …My parents' faces. I can finally see them properly.
      ja: …両親の顔、やっとちゃんと見える。
    - speaker: hero
      expression: smile
      ko: 만나면 이 사진 얘기부터 해야지.
      en: When I find them, I'll start with this photo.
      ja: 会えたら、まずこの写真の話をしよう。

  # 1차 게임기 진입: 사태 전의 일상(내기하던 상대가 있었다)을 한 줄로 심는다
  console-intro:
    - speaker: hero
      expression: smile
      ko: 오랜만에 한 판 해볼까.
      en: Been a while. Time for a round.
      ja: 久しぶりに一戦やるか。
    - speaker: hero
      expression: smile
      ko: 지는 쪽이 매점 쏘는 거였는데.
      en: Loser bought snacks. That was the rule.
      ja: 負けたほうが売店おごり、って決まりだったのに。
    # 카드 미궁의 규칙은 여기 적지 않는다. 선반 위 놀이책이 들고 있다
    # (src/data/room-clues.ts의 PUZZLE_CLUES). 대사로 흘리면 안 찾아도 풀린다.

  # 1차 게임기 결과: 이겨도 반응할 사람이 없다. lore("이기든 지든 똑같다")의 실연.
  # 덧붙이는 말 없이 한 줄로 끊는다. 빈 방에서는 이 한마디가 더 길게 울린다.
  console-alone:
    - speaker: hero
      ko: 이겼다.
      en: I won.
      ja: 勝った。

  console-echo:
    - speaker: hero
      expression: smile
      ko: 나가면 한 판 할거야.
      en: When I get out, we're playing a round.
      ja: 外に出たら 一戦やるんだ。

  # 1차 창밖 결과: 초기엔 사이렌이 있었고 지금은 정적. 사태의 경과를 소리로 흘린다
  window-silence:
    - speaker: hero
      expression: surprised
      ko: 처음엔 사이렌이 밤새 울렸는데.
      en: The first few days, the sirens went all night.
      ja: 最初のころは、サイレンが夜通し鳴ってたのに。
    - speaker: hero
      ko: 지금은… 아무 소리도 안 나.
      en: Now… there's no sound at all.
      ja: 今は…何の音もしない。

  # 1차 폰 결과: 단톡이 멈춘 날짜를 처음으로 못박는다. calendar가 이 날짜를 받는다.
  # 강도 2는 "이상하다"까지만: "다 끊겼다"는 단정은 라디오 전에 하지 않는다
  phone-stopped:
    - speaker: hero
      ko: 마지막 메시지가 10월 19일.
      en: The last message is from October 19.
      ja: 最後のメッセージは10月19日。
    - speaker: hero
      ko: 단톡이 이렇게 조용한 건 처음인데.
      en: The group chat has never been this quiet.
      ja: グループチャットがこんなに静かなの、初めてだ。

  # 컴퓨터 진입 (2바퀴 전용): 라디오 목소리가 "소식을 찾아볼 이유"를 만든다.
  #
  # 여기서 끝내고 나머지는 미니게임에 넘긴다: 부팅 로그가 흐르고, 잠금 화면이
  # 뜨고, 거기서 비밀번호를 묻는다. 켜지기도 전에 "비밀번호"를 말해 버리면
  # 화면이 그걸 보여주기 전에 답을 먼저 아는 꼴이 된다.
  computer-power-on:
    - speaker: hero
      ko: 라디오에 사람이 있었어. 그럼 그날 소식도 어딘가 남아 있겠지.
      en: There was a person on the radio. Then the news from that day must be saved somewhere too.
      ja: ラジオに人がいた。なら、あの日のニュースもどこかに残ってるはずだ。
    - speaker: hero
      ko: 인터넷은 그날부터 먹통이지만… 저장된 거라도 열리면 돼.
      en: The internet's been dead since that day… but whatever's saved will do.
      ja: ネットはあの日から死んでる…けど、保存されたものが開けばいい。
    - speaker: hero
      ko: 먼지 쌓인 본체에 전원을 넣는다.
      en: I press the power button on the dust-covered tower.
      ja: 埃をかぶった本体の電源を入れる。

  # 컴퓨터 결과: 메일과 뉴스를 다 본 뒤. 답장 못 한 가시와, 고립의 수치심을
  # 내려놓는 자리가 한 번에 온다 (한 번뿐인 조사라 둘을 갈라 놓을 자리가 없다)
  computer-archive:
    - speaker: hero
      expression: smile
      ko: 두 분 다 실컷 웃고 있네. 답장, 아직 못 했는데.
      en: Look at them, laughing away. I never did reply.
      ja: 二人ともよく笑ってるな。返事、まだしてなかった。
    - speaker: hero
      ko: 그리고 그 뒤로… 세상은 조금씩 멈추고 있었구나.
      en: And after that… the world was stopping, little by little.
      ja: そしてそのあと…世界は少しずつ止まっていったんだな。
    - speaker: hero
      ko: 나만 그런 게 아니었어. 다들 끝까지 서로한테 알리려고 했어.
      en: It wasn't just me. Everyone kept trying to reach each other, right to the end.
      ja: 俺だけじゃなかったんだ。みんな最後まで、誰かに知らせようとしてた。

  # 2차 폰 진입: 몇 주 만에 처음 온 알림. 지문이 안 먹어 비밀번호를 떠올려야 한다
  phone-unlock-intro:
    - speaker: hero
      expression: surprised
      ko: 폰이 울렸다. …지금?
      en: The phone just buzzed. …Now?
      ja: スマホが鳴った。…今？
    - speaker: hero
      ko: 몇 주 만에 처음 오는 알림이야.
      en: The first notification in weeks.
      ja: 何週間ぶりの通知だ。
    - speaker: hero
      ko: …지문이 안 먹네. 비밀번호로 바꿨었는데, 뭐였더라.
      en: …The fingerprint won't take. I changed the passcode… what was it?
      ja: …指紋が効かない。パスコードに変えたはずだけど、何だったっけ。

  # 2차 폰 결과: 그날의 문자가 늦게 도착했다는 확인, 그리고 기다림을 끝내는 결심
  phone-unlock-result:
    - speaker: hero
      ko: 그날 보낸 문자였어. 이제야 도착한 거야.
      en: She sent these that day. They only arrived now.
      ja: あの日送ったメッセージだったんだ。今になって届いたんだ。
    - speaker: hero
      ko: 기다리라고 했지. …충분히 기다렸어.
      en: She told me to wait. …I have waited long enough.
      ja: 待ってろって言われた。…もう十分待ったよ。

  # 1차 달력 진입: phone 뒤에만 열리므로(unlockAfter) 단톡의 날짜를 이어받아도 안전하다
  calendar-intro:
    - speaker: hero
      ko: 달력도 거기서 멈췄지. 10월 19일.
      en: The calendar stopped there too. October 19.
      ja: カレンダーもそこで止まってる。10月19日。

  # 1차 달력 결과: 고립이 얼마나 길었는지. 숫자는 일부러 안 박는다 (세다 만 것까지가 정서)
  calendar-tally:
    - speaker: hero
      ko: 正자가… 몇 개더라.
      en: How many tally marks is that now…
      ja: 正の字…いくつになったっけ。
    - speaker: hero
      ko: 세다 말았다. 세면 더 길게 느껴져서.
      en: I stopped counting. Counting makes it feel longer.
      ja: 数えるのはやめた。数えると、もっと長く感じるから。

  # 1차 라디오 진입: 마지막 남은 물건 앞에 선 한마디
  radio-intro:
    - speaker: hero
      ko: 이제 남은 건 라디오뿐이네.
      en: The radio is the only thing left.
      ja: 残ってるのはラジオだけか。
    - speaker: hero
      ko: …어차피 노이즈밖에 안 잡히겠지만.
      en: …It only ever picks up noise anyway.
      ja: …どうせノイズしか入らないけど。

  # 재난방송. 화자가 도해가 아니라 라디오라 초상이 붙지 않는다.
  # 이 게임에서 도해 아닌 목소리가 대사창을 쓰는 첫 자리다.
  #
  # 글자 맞추기(답: 좀비)에 대답한 직후라, 방송은 그 답이 맞았다는 확인으로
  # 들린다. 끝의 독백 두 줄은 "몰랐던 게 아니라 잊은 척했다"를 처음 적는 자리.
  radio-broadcast:
    - speaker: broadcast
      ko: …긴급 재난 방송입니다. 좀비 사태가 발생하고 있습니다. 전 국민은 즉시 실내로 대피하십시오.
      en: …This is an emergency broadcast. A zombie outbreak is underway. All citizens must take shelter indoors immediately.
      ja: …緊急災害放送です。ゾンビ災害が発生しています。国民の皆さんは直ちに屋内へ避難してください。
    - speaker: broadcast
      ko: 감염 사태는 수도권을 넘어 남부 전역으로 확산되고 있습니다.
      en: The infection has spread past the capital region into the entire south.
      ja: 感染は首都圏を越え、南部全域へ拡大しています。
    - speaker: broadcast
      ko: 부산까지 감염 사태가 번졌습니다. 현재 통제가 유지되는 지역은…
      en: It has reached Busan. The areas still under control are…
      ja: 釜山まで感染事態が広がりました。現在、統制が保たれている地域は…
    - speaker: broadcast
      ko: 지지…직…
      en: Kssh… kkt…
      ja: ザ…ザッ…
    - speaker: hero
      ko: …맞아. 그랬었지.
      en: …Right. That's how it was.
      ja: …そうだ。そうだったな。
    - speaker: hero
      ko: 잊고 있던 게 아니라, 잊은 척하고 있었던 거야.
      en: I hadn't forgotten. I was pretending I had.
      ja: 忘れてたんじゃない。忘れたふりをしてたんだ。

  # 2차 라디오: 저 혼자 지직거리는 라디오 앞에 다시 앉자마자 목소리가 든다.
  # 다이얼을 다시 돌리게 하지 않는다. 주파수 맞추기는 1바퀴에서 이미 한 번 했고,
  # 이번에는 라디오가 먼저 말을 거는 것이라 손을 쓸 이유가 없다.
  #
  # 컷씬에서 스쳤던 목소리가 이번엔 또렷하게 잡힌다.
  # 다급한 생존자다. 모일 곳이 있다는 것까지만 말하고 끊긴다. 자세한 건
  # 엔딩(방을 나서는 이유) 몫이라 여기서 다 말하지 않는다.
  radio-voice:
    - speaker: hero
      ko: …너, 아까 분명히 꺼졌잖아.
      en: …You went dead. I watched you go dead.
      ja: …お前、さっき確かに消えたよな。
    - speaker: signal
      ko: 아, 씨… 이거 나가긴 하는 거야? 들리는 사람 있어?
      en: Ah, damn… is this thing even transmitting? Can anyone hear me?
      ja: あー、くそ…これ、届いてるのか？聞こえるやついるか？
    - speaker: signal
      ko: 생존자 있으면 이리로 와. 기억해, 여기에 답이 있어.
      en: If you're alive out there, come to us. Remember, the answer is here.
      ja: 生存者がいたらこっちに来い。覚えとけ、ここに答えがある。
    - speaker: signal
      ko: 자세한 건 모이면… 지지직… 뚝.
      en: We'll talk once we're together… kssht… click.
      ja: 詳しくは集まってから…ザザッ…ブツッ。
    - speaker: hero
      expression: surprised
      ko: 사람이다. 진짜 사람 목소리다.
      en: That's a person. That's a real voice.
      ja: 人だ。本物の人の声だ。
    - speaker: hero
      ko: 여기 앉아 있어서는 아무 일도 안 일어나겠지.
      en: Nothing happens if I keep sitting here.
      ja: ここに座っていても、何も起きないよな。

  # 2차 조사: 벽에 혼자 던지던 공이 "같이 던질 사람"의 물건으로 돌아온다
  ball-echo:
    - speaker: hero
      ko: 혼자 던지는 건 이제 그만해도 되려나.
      en: Maybe I can stop throwing it alone.
      ja: ひとりで投げるのは、もうやめてもいいかな。
    - speaker: hero
      expression: smile
      ko: 받아줄 놈 찾으면, 그때 다시 던지자.
      en: When I find someone to catch it, we'll throw again.
      ja: 受けてくれるやつを見つけたら、そのときまた投げよう。

  # ─────────────────────────────────────────────── 2막 · 거실 (준비)
  #
  # 각성 직후의 두 조사. 아직 추리가 아니다. "뭐라도 해야겠다"는 행동뿐이고,
  # 식량 재해석 복선만 조용히 깔린다 (docs/content-design.md 4장 순서 1).
  fridge-open:
    - speaker: hero
      ko: 나갈 거면 뭐라도 챙겨야지. 냉장고부터.
      en: If I'm going out, I should take something. Start with the fridge.
      ja: 出るなら何か持っていかないと。まずは冷蔵庫から。
    # 부모님이 흘린 말은 아직 인용하지 않는다. 여기서는 도해가 숫자만 이상해한다.
    # 확신은 거실 단서(shoes·cards)가 서고 나서야 온다.
    - speaker: hero
      ko: 한 달을 먹었는데 아직 반이 남았어.
      en: I've been eating for a month and it's still half full.
      ja: ひと月食べてきたのに、まだ半分残ってる。
    - speaker: hero
      ko: 2박 3일 다녀온다면서, 왜 이만큼을 채워놨을까.
      en: Two nights, they said. So why stock this much?
      ja: 二泊三日って言ってたのに、なんでこんなに詰めていったんだ。
    - speaker: hero
      ko: …이거, 여행 준비가 아니었네.
      en: …This wasn't packing for a trip.
      ja: …これ、旅行の支度じゃなかったな。

  duffel-pack:
    - speaker: hero
      ko: 야구 가방 비우자. 글러브는 두고 간다.
      en: I'll empty the baseball bag. The glove stays.
      ja: 野球バッグを空けよう。グローブは置いていく。
    - speaker: hero
      ko: 물, 통조림, 손전등. 이 정도면 되겠지.
      en: Water, cans, a flashlight. That should do it.
      ja: 水、缶詰、懐中電灯。これくらいでいいか。
    - speaker: hero
      ko: 30일 만에 처음으로 짐을 싼다.
      en: First time I've packed anything in thirty days.
      ja: 三十日ぶりに荷物をまとめた。

  # ─────────────────────────────────────────────── 2막 · 거실 (단서)
  #
  # 여기서부터 부모님이 흘린 말이 회상으로 들어온다. 흘린 말 하나에 단서 하나가
  # 대응한다 (docs/content-design.md 4-1).
  shoes-open:
    - speaker: hero
      ko: 신발장. 열어본 지 한참 됐네.
      en: The shoe cabinet. Haven't opened it in a long time.
      ja: 靴箱。開けるのは久しぶりだ。
    - speaker: hero
      ko: 아빠 등산화. 그대로 있어.
      en: Dad's hiking boots. Still here.
      ja: 父さんの登山靴。そのままだ。
    - speaker: dad
      ko: 이번엔 안 걷는 여행이야. 등산화는 놔두고 갈게.
      en: No walking on this one. I'll leave the boots.
      ja: 今回は歩かない旅行だ。登山靴は置いていくよ。
    - speaker: hero
      ko: 안 걷는 여행인데, 캐리어는 두 개였잖아.
      en: A trip with no walking, and two suitcases.
      ja: 歩かない旅行なのに、スーツケースは二つだったよな。
    - speaker: hero
      ko: 뭘 그렇게 많이 들고 간 거야, 대체.
      en: What exactly did you carry off with you?
      ja: いったい何をそんなに持っていったんだ。

  cards-intro:
    - speaker: hero
      ko: 식탁에 카드가 그대로 있네.
      en: The cards are still laid out on the table.
      ja: 食卓にカードがそのまま残ってる。
    - speaker: mom
      ko: 다음에 오면 이거 마저 치자.
      en: We'll finish this hand next time.
      ja: 次に来たら、これの続きをやろうね。

  # 카드 미궁(card-odd)을 푼 뒤. 규칙은 방 선반의 놀이책이 들고 있다.
  # 여기 대사로 흘리면 단서를 안 찾아도 풀린다 (src/data/room-clues.ts).
  cards-unfinished:
    - speaker: hero
      ko: 마지막 판, 아직 안 끝났어.
      en: The last hand never finished.
      ja: 最後の一局、まだ終わってない。
    - speaker: hero
      ko: 다음에 오면… 그 말, 진심이었을까.
      en: Next time, they said. Did they mean it?
      ja: 次に来たら…あの言葉、本気だったのかな。
    - speaker: hero
      ko: 아니. 진심이었으니까 판을 안 치운 거겠지.
      en: No. They meant it. That's why nobody cleared the table.
      ja: いや。本気だったから、片づけなかったんだろう。

  # ─────────────────────────────────────────────── 2막 · 거실 (마지막)
  #
  # 조합의 자리. 단서 셋이 여기서 한 문장으로 맞물리고, "손대지 마"라던
  # 아래칸이 열린다. 완료되면 스토어가 작별의 회상을 띄운다.
  ampoule-note:
    - speaker: hero
      ko: 냉장고 문에 붙은 메모. 자석에 눌려서 뒷장이 있는 줄도 몰랐네.
      en: The note on the fridge door. The magnet hid a second page.
      ja: 冷蔵庫の扉のメモ。マグネットに隠れて、裏に一枚あるとは思わなかった。
    - speaker: dad
      ko: 아래칸은 손대지 마. 엄마가 정리해뒀어.
      en: Don't touch the bottom drawer. Your mother sorted it out.
      ja: 下の段には手をつけるな。母さんが片づけておいたから。
    - speaker: hero
      ko: 등산화, 안 끝난 판, 그리고 이 메모.
      en: The boots, the unfinished hand, and this note.
      ja: 登山靴、終わらなかった一局、そしてこのメモ。
    - speaker: hero
      ko: 전부 다시 온다는 얼굴을 하고 있었어. 근데 정리해두는 건 떠나는 사람이 하는 일이잖아.
      en: All of it wore the face of coming back. But sorting things out is what people do when they leave.
      ja: どれも「また帰ってくる」って顔をしてた。でも片づけていくのは、去る人がやることだ。
    - speaker: hero
      ko: …열어보자.
      en: …Let's open it.
      ja: …開けてみよう。

  # 서랍을 열고(ampoule-pickup) 앰플을 손에 든 뒤. 들고 있는 채로 흐른다.
  ampoule-found:
    - speaker: hero
      expression: surprised
      ko: 이게 뭐야.
      en: What is this.
      ja: 何だこれ。
    - speaker: hero
      ko: 유리 앰플. 라벨은 반쯤 지워져서 못 읽겠다.
      en: A glass ampoule. The label is half worn off. I can't read it.
      ja: ガラスのアンプル。ラベルは半分消えていて読めない。
    - speaker: hero
      ko: 식량 밑에 이런 걸 묻어두고 갔다고?
      en: They buried this under the food and left?
      ja: 食料の下にこんなものを埋めて、行ったのか。
    - speaker: hero
      ko: …알고 있었던 거야. 이렇게 될 걸.
      en: …They knew. They knew this was coming.
      ja: …知ってたんだ。こうなることを。
    - speaker: hero
      ko: 그럼 이건 버리고 간 게 아니라, 남기고 간 거네.
      en: Then this isn't something they abandoned. It's something they left for me.
      ja: なら、これは捨てていったんじゃない。遺していったんだ。
