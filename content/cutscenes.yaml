# 컷씬: 일러스트 위로 대사가 흐르는 연출 (v4 설계서 3-3 · 3-6).
#
# 그림 안에 말풍선을 넣지 않는 것이 이 연출의 규칙이라, 대사는 컷씬 전용 창을
# 새로 만들지 않고 기존 대사창(DialogueBox)이 그대로 받는다. 예외는 웹툰(page)
# 하나다: 생존자 방송은 라디오 말풍선이 칸 안에 선다. 컷씬이 도는 동안
# BGM은 멎는다 (selectMusicPlaying).
#
# 컷 하나의 형태:
#   image   일러스트 경로 (public 기준). 파일이 아직 없어도 회색 판이 자리를 지킨다.
#           없으면 그림 없이 방이 그대로 비친 채 대사창만 뜬다.
#   black   true면 검정 화면. 그림도 판도 없이 어둠 위에 대사창만 뜬다 (과거편의 마지막 컷).
#           image·page와 같이 못 쓴다.
#   page    웹툰 칸의 페이지(1부터). 있으면 웹툰 뷰어(WebtoonViewer)로 돈다: 페이지 안에서
#           칸이 번호순으로 떠오르고, 대사는 칸 안의 라디오 말풍선(한 줄)이다. 페이지 없는
#           컷은 맨 뒤에만: 웹툰이 걷힌 뒤 방에서 대사창으로 흐르는 한마디다.
#   ratio   웹툰 칸의 비율. "16:9"는 페이지 폭 한 줄, "3:4"는 둘이 나란히 한 줄.
#   narration  true면 누르지 않아도 줄이 저절로 찍히고 다 찍히면 다음 컷 (과거편).
#   sfx     컷이 뜨는 순간 한 번 나는 효과음 (schema.mjs의 CUT_SFX). radioSignOff는
#           0.8초 치지직 뒤 끊김.
#   holdMs  대사가 끝난 뒤 대사창 없이 그림만 남기는 시간(ms). 대사가 없는 컷
#           (lines: [])은 이 시간만큼 그림만 서 있다가 저절로 넘어간다.
#   lines   scripts.yaml과 같은 형태 (speaker / expression / ko / en / ja).
#
# 어떤 컷씬이 언제 도는지:
#   console-flashback  게임기 1차 (memories.yaml의 cutscene)
#   ball-flashback      공 1차 (memories.yaml의 cutscene)
#   workbook-name       문제집 뒤표지의 이름을 보고 내려놓은 순간 (store의 closeClue)
#   radio-blackout      라디오 1차(재난방송)를 마친 순간 (store가 1바퀴 완주에 연다)
#   survivor-broadcast  라디오 2차 (memories.yaml의 cutscene)
#   trip-doubt          신발장 + 아빠 메일을 둘 다 본 순간 (store: tripDoubted)
#   p2-close            2페이즈 필수 조사를 다 마친 순간 (store: STORY_CUTSCENES)
#   p4-close            4페이즈 서류 순서 + 출입증을 마친 순간 (store: STORY_CUTSCENES)
#   still-beat          액자 2차 (memories.yaml의 cutscene)
#   bat-grip            현관 배트를 쥔 순간 (store의 takeBat)
#
# 컷씬 id를 바꾸면 src/data/memory-room.ts의 상수도 같이 고쳐야 한다.

cutscenes:
  #
  # 문제집 뒤표지에서 이름을 찾고 내려놓는 순간 (store의 closeClue). 그림 없이 방에서
  # 대사창만 흐른다. 도해가 누구인지를 처음으로 소리 내어 말하는 자리다.
  workbook-name:
    - lines:
        - speaker: hero
          ko: 수능 기출문제집. 한도해. 내 글씨다.
          en: Past entrance-exam questions. Han Do-hae. That's my handwriting.
          ja: 入試の過去問題集。ハン・ドヘ。俺の字だ。
        - speaker: hero
          ko: 여름에 마지막 야구부 활동을 끝내고 그때부터 고삼 생활로 돌아갔다.
          en: I played my last season with the baseball team in the summer, and after that it was back to senior-year life.
          ja: 夏に野球部の最後の活動を終えて、そこから受験生の生活に戻った。
        - speaker: hero
          ko: 이것도 그때 샀다. 수험생 노릇 해 보겠다고.
          en: I bought this back then, too. Trying to play the part of a test-taker.
          ja: これもそのときに買った。受験生らしくしてみようって。

  #
  # 1페이즈 회상: 강도 1의 두 기억만. 결과 대사(혼자 이기고, 혼자 휘두른다) 바로 뒤에
  # "같이 하던 사람이 있던 때"를 한 장 세운다. 마지막 줄이 빈 방으로 돌아오는 자리다.
  # 뒤이은 라디오 컷씬들보다 가볍게: 그림 한 장, 대사 다섯 줄, 짧은 정적.
  # 강도 2부터(액자·폰)는 회상을 붙이지 않는다. 부모님 얼굴(액자 2차)과
  # 엄마 문자(폰 2차)의 보상을 먼저 써 버리기 때문이다.
  #
  # 주완(같은 반, 야구부 아님)과 2P로 격투 게임을 하던 때. 그림은 주완이 나간
  # 직후의 빈자리만 보이고, 사람은 나오지 않는다. 다섯 줄이 그림 위에 흐르고
  # 마지막 줄("언젠지 기억이 안 나네")이 빈 방으로 돌아오는 자리다.
  console-flashback:
    - image: /assets/images/mg-cutscene-console-flashback.webp?v=2
      holdMs: 1200
      lines:
        - speaker: hero
          ko: 게임은 같은 반 친구인 주완이와 자주 했었다.
          en: I used to play games a lot with Juwan, a friend from my class.
          ja: ゲームは、同じクラスの友達のジュワンとよくやっていた。
        - speaker: hero
          ko: 시험 끝난 주에는 집에 놀러 와서 2p로 격투 게임을 플레이하곤 했다.
          en: The week exams ended, he'd come over and we'd play fighting games in two-player mode.
          ja: テストが終わった週にはよく家に遊びに来て、2Pで格闘ゲームをしていた。
        - speaker: hero
          expression: smile
          ko: 내가 좀 더 많이 이겼었던 것 같다.
          en: I think I won a little more often.
          ja: 俺のほうが少し多く勝ってた気がする。
        - speaker: hero
          ko: 다음에는 캐릭터 바꿔서 하자고 했었는데.
          en: We said we'd swap characters next time.
          ja: 次はキャラを交換してやろうって言ってたっけ。
        - speaker: hero
          ko: …마지막으로 한 게 언젠지 기억이 안 나네.
          en: …I can't remember the last time we played.
          ja: …最後にやったのがいつだったか、思い出せないな。

  #
  # 16강이 끝난 직후 홈플레이트. 해가 포수 등 뒤에 있어 얼굴이 역광에 묻힌다.
  # 보이는 건 미트 낀 손뿐이다: 엔딩 합류 컷(얼굴 대신 미트)과 짝이다 (docs/story/story.md).
  # 손바닥으로 미트를 두드리던 버릇의 소리가 방송 첫 칸의 탁, 탁(mittTap)과 이어지는 포수 복선이다.
  # 윤호의 생사·행방은 묻기만 하고 답하지 않는다.
  ball-flashback:
    - image: /assets/images/mg-cutscene-ball-flashback.webp?v=3
      holdMs: 1500
      lines:
        - speaker: hero
          ko: 야구를 오래 해 온 나는 야구로 유명한 청서고에 진학했다.
          en: I'd played baseball for years, so I went to Cheongseo High, a school known for baseball.
          ja: ずっと野球をやってきた俺は、野球で有名な青瑞高に進学した。
        - speaker: hero
          ko: 올해 있었던 전국 대회 16강에서는 근처 학교이자 야구 라이벌인 은강고와 맞붙게 되었다.
          en: In this year's nationals round of 16, we faced Eungang High, a nearby school and our baseball rival.
          ja: 今年の全国大会ベスト16では、近所の学校で野球のライバルでもある銀江高と当たった。
        - speaker: hero
          expression: smile
          ko: 2루수인 나는, 포수인 절친 윤호와 기합을 다졌었다.
          en: I played second base, and I psyched myself up with my best friend Yunho, our catcher.
          ja: セカンドの俺は、キャッチャーで親友のユノと気合いを入れ合った。
        - speaker: hero
          ko: 하지만 결국 졌지. 은강고 포수가 손바닥으로 미트를 탁탁 두드리던 소리가 기억에 남는다.
          en: But we lost in the end. I still remember the sound of Eungang's catcher slapping his palm against his mitt.
          ja: でも結局負けた。銀江高のキャッチャーが手のひらでミットをパンパンと叩いていた音が、耳に残っている。
        - speaker: hero
          ko: 윤호는 지금 뭘 하고 있을까?
          en: I wonder what Yunho's doing now.
          ja: ユノは今、何をしてるんだろう。

  #
  # 분기점 과거편 (docs/story/story.md 3장 분기점): 그날이 한 컷씩 지나간다.
  # 주파수를 잡은 라디오가 지직거리다 꺼지면(도입) 검정 화면 세 컷이 먼저 온다:
  # 노이즈뿐인 라디오 앞의 한 줄 → 정적 → 그날의 재난 방송. 방송이 흐르는 동안 화면 위
  # 혼잣말 자리에는 도해의 속말(whispers)이 번갈아 떴다 진다.
  # 내레이션 컷(narration)은 누르지 않아도 줄마다 창을 비우고 타자기로 새로 찍히며, 다 찍히면
  # 다음 컷으로 넘어간다. 얼어붙은 얼굴 컷만 말 없이 1.5초 정적이다.
  # 마지막 컷은 검정 화면(black): 그날의 회상이 끝나고 "그날 이후"를 대사창으로 말한다.
  # 끝나면 3D 방으로 돌아온다. 방은 가장 어둡고, BGM은 없고, 라디오는 빨갛게 깜빡인다.
  # 돌아와서 드는 혼잣말은 stages.yaml의 turn-bottom (라디오에 다른 신호가 잡힌다).
  radio-blackout:
    # 꺼진 라디오 앞. 노이즈만 남았다
    - black: true
      lines:
        - speaker: hero
          expression: sad
          ko: 노이즈뿐인 라디오를 들으니 그날의 기억이 떠오른다.
          en: Listening to the radio, nothing but noise, the memory of that day comes back.
          ja: ノイズしか流れないラジオを聞いていると、あの日の記憶がよみがえる。
    # 정적
    - black: true
      holdMs: 2000
      lines: []
    # 그날의 재난 방송 (자동 반복 송출 톤). 위로는 도해의 속말이 떴다 진다
    - black: true
      whispers:
        - ko: …떠올리고 싶지 않아.
          en: …I don't want to remember.
          ja: …思い出したくない。
        - ko: 그만해…
          en: Stop…
          ja: やめてくれ…
        - ko: 겨우 덮어 뒀는데…
          en: I'd finally buried it…
          ja: やっと蓋をしたのに…
      lines:
        - speaker: broadcast
          ko: …긴급 재난 방송입니다. 원인을 알 수 없는 감염병이 발생했습니다. 국민 여러분은 즉시 실내로 대피하십시오.
          en: …This is an emergency broadcast. An infectious disease of unknown origin has broken out. All citizens must take shelter indoors immediately.
          ja: …緊急災害放送です。原因不明の感染症が発生しました。国民の皆さんは直ちに屋内へ避難してください。
        - speaker: broadcast
          ko: 감염 사태는 수도권을 넘어 남부 전역으로 확산되고 있습니다.
          en: The infection has spread past the capital region into the entire south.
          ja: 感染は首都圏を越え、南部全域へ拡大しています。
        - speaker: broadcast
          ko: 부산까지 감염 사태가 번졌습니다. …반복합니다. 긴급 재난 방송입니다.
          en: The infection has now reached Busan. …Repeat. This is an emergency broadcast.
          ja: 感染は釜山まで広がりました。…繰り返します。緊急災害放送です。
        - speaker: hero
          expression: sad
          ko: …맞아. 그날이었다.
          en: …Right. It was that day.
          ja: …そうだ。あの日だった。
    # 교문 앞, 엄마 문자 미리보기
    - image: /assets/images/cutscene-day-1.webp?v=3
      narration: true
      lines:
        - speaker: hero
          ko: 그날은 평범한 날이었다.
          en: It was an ordinary day.
          ja: あの日は、普通の日だった。
        - speaker: hero
          ko: 보충수업 끝나고 폰을 보니 엄마 문자가 와 있었다.
          en: After extra classes, I checked my phone and there was a text from Mom.
          ja: 補習が終わってスマホを見ると、母さんからメッセージが来ていた。
        - speaker: hero
          ko: '"오늘은 독서실 가지 말고 바로 집에 와." …이상한 말이었다.'
          en: '"Skip the study room today and come straight home." …That was a strange thing to say.'
          ja: 「今日は自習室に行かないで、まっすぐ帰ってきて。」…おかしなことを言うなと思った。
    # 2컷: 단지 안, 문 열린 채 버려진 차
    - image: /assets/images/cutscene-day-2.webp?v=2
      narration: true
      lines:
        - speaker: hero
          ko: 단지 안이 조용했다.
          en: The apartment complex was quiet.
          ja: 団地の中が静かだった。
        - speaker: hero
          ko: 문이 열린 채 서 있는 차. 사람은 없었다.
          en: A car sitting there with its door open. No one around.
          ja: ドアが開いたまま止まっている車。人はいなかった。
        - speaker: hero
          ko: …사이렌 소리가 멀리서 났다.
          en: …Sirens wailed in the distance.
          ja: …遠くでサイレンが鳴っていた。
        - speaker: hero
          ko: 집 앞까지는 평소랑 똑같았다.
          en: All the way to my door, everything was the same as always.
          ja: 家の前までは、いつもと同じだった。
    # 3컷: 복도 끝에 서 있는 감염자
    - image: /assets/images/cutscene-day-3.webp?v=3
      narration: true
      lines:
        - speaker: hero
          ko: 복도에 누가 서 있었다.
          en: Someone was standing in the hallway.
          ja: 廊下に誰かが立っていた。
        - speaker: hero
          ko: 이상한 느낌이 들었다.
          en: Something felt off.
          ja: 妙な感じがした。
    # 4컷: 손을 뻗으며 덮쳐 오는 감염자. 말 없이 정적
    - image: /assets/images/cutscene-day-4.webp?v=3
      holdMs: 1200
      lines: []
    # 5컷: 놀란 얼굴. 말 없이 정적
    - image: /assets/images/cutscene-day-5.webp?v=4
      holdMs: 1500
      lines: []
    # 6컷: 복도를 달림
    - image: /assets/images/cutscene-day-6.webp?v=4
      narration: true
      lines:
        - speaker: hero
          ko: 정신없이 달렸다.
          en: I ran without thinking.
          ja: 無我夢中で走った。
        - speaker: hero
          ko: 뒤에서 나는 소리는 사람 소리가 아니었다.
          en: The sounds behind me weren't human.
          ja: 後ろから聞こえる音は、人の声じゃなかった。
    # 7컷: 현관에 주저앉음
    - image: /assets/images/cutscene-day-7.webp?v=3
      narration: true
      lines:
        - speaker: hero
          ko: 문을 잠갔다.
          en: I locked the door.
          ja: ドアに鍵をかけた。
        - speaker: hero
          ko: 부모님은 여행 중이셨기에 집안엔 아무도 없었다.
          en: Mom and Dad were away on their trip, so there was no one home.
          ja: 両親は旅行中で、家には誰もいなかった。
        - speaker: hero
          ko: 급박했던 상황이 거짓이었던 듯 정적이 내려앉았다.
          en: Silence settled in, as if none of the panic had been real.
          ja: さっきまでの騒ぎが嘘のように、静けさが降りてきた。
    # 8컷: TV 불빛에 무표정
    - image: /assets/images/cutscene-day-8.webp
      narration: true
      lines:
        - speaker: hero
          ko: 뉴스는 아직 나오고 있었다.
          en: The news was still on.
          ja: ニュースはまだ流れていた。
        - speaker: hero
          ko: 감염, 확산, 대피. 아나운서가 낯선 말들을 다급하게 외치고 있었다.
          en: Infection, spread, evacuation. The anchor was shouting unfamiliar words in a panic.
          ja: 感染、拡大、避難。アナウンサーが聞き慣れない言葉を慌ただしく叫んでいた。
        - speaker: hero
          ko: 사방에서 들려오는 비명소리에 귀를 막았다.
          en: Screams came from every direction. I covered my ears.
          ja: 四方から聞こえてくる悲鳴に、耳をふさいだ。
    # 9컷: 검정 화면. 그날에서 지금으로 건너오는 두 줄
    - black: true
      narration: true
      lines:
        - speaker: hero
          ko: 그날 이후로 난 집에 고립되어 있었다.
          en: Ever since that day, I've been shut in at home.
          ja: あの日から、俺は家に閉じこもっていた。
        - speaker: hero
          ko: 나가서 마주할 현실이 두려워서.
          en: Because I was afraid of what I'd have to face out there.
          ja: 外に出て向き合う現実が怖くて。

  #
  # 생존자 방송: 3페이지 10칸 웹툰 (WebtoonViewer). 페이지 안에서 칸이 번호순으로
  # 떠오르고, 방송 대사는 대사창이 아니라 칸 안의 라디오 말풍선이다. 16:9 칸은 페이지
  # 폭 한 줄, 3:4 칸은 둘이 나란히 한 줄. 말풍선은 다 찍히면 0.6초 뒤, 대사 없는 칸은
  # holdMs 뒤 다음 칸. 화자 이름은 ??? 그대로다. 이름은 게임 안에서 부르지 않는다.
  # ①은 방송 전에 미트를 탁, 탁 두 번 치는 소리(mittTap, 실제 미트 소리 파일)를 낸다.
  # 1막 사인볼 회상의 "상대 포수가 손바닥으로 미트를 탁탁, 두 번 두드리고 앉았다"와 이어지는 포수 복선. 대사 칸마다 짧은 라디오 노이즈,
  # ⑩에서 치지직 끊김. 웹툰이 걷히면 방에서 도해의 한마디가 대사창으로 흐른다.
  survivor-broadcast:
    # 1페이지
    - image: /assets/images/cutscene-survivor-1.webp?v=2
      page: 1
      ratio: "16:9"
      sfx: mittTap
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-2.webp?v=2
      page: 1
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-3.webp?v=3
      page: 1
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-4.webp?v=4
      page: 1
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 어이, 거기 누구 없어? …이거 나가긴 하는 거야?
          en: Hey, anyone out there? …Is this even going out?
          ja: おい、誰かいないか? …これ、ちゃんと届いてんのか?
    # 2페이지
    - image: /assets/images/cutscene-survivor-5.webp?v=2
      page: 2
      ratio: "3:4"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 여기 은강고 체육관에 생존자들 모여 있어.
          en: We've got survivors gathered here at the Eungang High gym.
          ja: ここ、銀江高の体育館に生存者が集まってる。
    - image: /assets/images/cutscene-survivor-6.webp?v=3
      page: 2
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-7.webp?v=2
      page: 2
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 방송실 장비에 송신기 물려서 쏘는 거라 멀리는 안 가. 이 동네면 들릴 거야.
          en: I hooked a transmitter up to the broadcast room gear, so it won't reach far. You'll hear it around here, though.
          ja: 放送室の機材に送信機をつないで飛ばしてるから、遠くまでは届かない。この辺なら聞こえるはずだ。
    # 3페이지
    - image: /assets/images/cutscene-survivor-8.webp?v=4
      page: 3
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 나흘 밤 지나면 여기서 이동한다. 헬기가 뜬다는 정보를 입수했어.
          en: After four nights, we're moving out. We got word a helicopter's coming.
          ja: 四晩たったら、ここから移動する。ヘリが飛ぶって情報が入った。
    - image: /assets/images/cutscene-survivor-9.webp?v=2
      page: 3
      ratio: "3:4"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 그러니까 듣고 있는 사람이 있다면 은강고 체육관으로 모여. …늦지 말고 와.
          en: So if anyone's listening, get to the Eungang High gym. …Don't be late.
          ja: だから、聞いてるやつがいたら銀江高の体育館に集まれ。…遅れるなよ。
    # 치지직: 방송이 끊긴다. 0.8초 끊김 뒤 웹툰이 걷힌다
    - image: /assets/images/cutscene-survivor-10.webp?v=3
      page: 3
      ratio: "3:4"
      sfx: radioSignOff
      holdMs: 1500
      lines: []
    # 방으로 돌아와서. 학교 이름은 재하를 가리키고, 목소리는 흐린 채 둔다:
    # "또래 남자"가 윤호나 주완일 수 있다는 여지 (속편 떡밥, 확인해 주지 않는다)
    - lines:
        - speaker: hero
          expression: surprised
          ko: 은강고…? 그때 그…?
          en: Eungang High…? That guy from back then…?
          ja: 銀江高…? あのときの…?
        - speaker: hero
          ko: …목소리가 좀 익숙한데.
          en: …That voice sounds kind of familiar.
          ja: …なんか、聞き覚えのある声だな。

  #
  # 캐리어 개수 추리의 결론 (v4.1 3장). 신발장과 아빠 메일("2박 3일")을 둘 다 본 순간.
  # 냉장고(한 달 먹고 반) → 신발장(캐리어 둘, 등산화는 집에) → 아빠 메일(2박 3일)을 한 줄씩 잇는다
  trip-doubt:
    - lines:
        - speaker: hero
          expression: puzzled
          ko: 냉장고 안 음식은 한 달을 먹고도 반이 남았다.
          en: I've been eating from the fridge for a month, and it's still half full.
          ja: 冷蔵庫の食べ物は、ひと月食べてもまだ半分残っている。
        - speaker: hero
          expression: puzzled
          ko: 캐리어를 두 개 가져가셨지만, 등산화는 집에 남아있다.
          en: They took two suitcases, but Dad's hiking boots are still at home.
          ja: スーツケースは二つ持っていったのに、登山靴は家に残っている。
        - speaker: hero
          ko: 2박 3일이라고 했는데 가져간 짐은 한 달 치였어.
          en: They said two nights, but they packed for a month.
          ja: 二泊三日って言ってたのに、持っていったのはひと月分の荷物だった。

  #
  # 2페이즈를 닫는 한 줄. 그림 없이 방이 비친 채로 흐른다.
  p2-close:
    - lines:
        - speaker: hero
          ko: 여행이 아니었어. 둘 다 뭔가 알고 있었어.
          en: It wasn't a trip. They both knew something.
          ja: 旅行じゃなかった。二人とも何か知ってたんだ。

  #
  # 4페이즈 서류와 출입증을 마친 뒤: 라디오의 "치료할 방법"과 앰플이 이어진다.
  # 이어서 각오를 한 번 더 다진다: 부모님의 진실 → 앰플 → 기한 안에 체육관. 목적을 잊지 않게.
  # 이 줄이 끝나면 방의 액자에 금빛이 돈다.
  p4-close:
    - lines:
        - speaker: hero
          ko: …이게 답일지도 몰라.
          en: …This might be the answer.
          ja: …これが答えかもしれない。
        - speaker: hero
          ko: 엄마 아빠는 이걸 지키려고 간 거였어. 여행이 아니었던 거야.
          en: Mom and Dad left to protect this. It was never a trip.
          ja: 父さんと母さんは、これを守るために行ったんだ。旅行じゃなかったんだ。
        - speaker: hero
          ko: 앰플을 들고, 나흘 안에 은강고 체육관으로 가자.
          en: Take the ampoule and get to the Eungang High gym within four days.
          ja: アンプルを持って、四日以内に銀江高の体育館へ行こう。

  #
  # 정적 비트: 액자 2차(얼굴이 돌아온 사진) 직후. BGM이 멎고 카메라가 머문 채
  # 몇 초가 흐른 뒤 한 줄. 액자를 세워 두는 연출이다. 끝나면 현관 배트에 금빛이 돈다.
  still-beat:
    - holdMs: 2600
      lines: []
    - lines:
        - speaker: hero
          ko: …갔다 올게.
          en: …I'll be back.
          ja: …行ってきます。

  #
  # 현관의 배트를 쥔 순간. 대사가 끝나면(건너뛰어도) 스토어가 배트를 쥔 것으로
  # 기록한다 (takeBat). 배트는 떠나기 전 챙길 것 셋(가방·앰플·배트) 중 하나라, 셋을 다
  # 챙겨야 현관문이 열린다. "나가자."는 그때 위쪽 혼잣말(stages.yaml resolve-ready)이 맡는다.
  bat-grip:
    - lines:
        - speaker: hero
          ko: 3년 쓴 배트다. 이걸로 공만 쳤는데.
          en: Three years with this bat. All I ever hit with it was a ball.
          ja: 三年使ったバットだ。これで打ったのはボールだけだったのに。
        - speaker: hero
          ko: …이것도 가져간다.
          en: …This comes too.
          ja: …これも持っていく。
