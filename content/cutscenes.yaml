# 컷씬: 일러스트 위로 대사가 흐르는 연출 (v4 설계서 3-3 · 3-6).
#
# 그림 안에 말풍선을 넣지 않는 것이 이 연출의 규칙이라, 대사는 컷씬 전용 창을
# 새로 만들지 않고 기존 대사창(DialogueBox)이 그대로 받는다. 예외는 웹툰(page)
# 하나다: 생존자 방송은 라디오 말풍선이 칸 안에 선다. 컷씬이 도는 동안
# BGM은 멎는다 (selectMusicPlaying).
#
# 컷 하나의 형태:
#   image   일러스트 경로 (public 기준). 파일이 아직 없어도 회색 판이 자리를 지킨다.
#           없으면 그림 없이 방이 그대로 비친 채 대사창만 뜬다.
#   page    웹툰 칸의 페이지(1부터). 있으면 웹툰 뷰어(WebtoonViewer)로 돈다: 페이지 안에서
#           칸이 번호순으로 떠오르고, 대사는 칸 안의 라디오 말풍선(한 줄)이다. 페이지 없는
#           컷은 맨 뒤에만: 웹툰이 걷힌 뒤 방에서 대사창으로 흐르는 한마디다.
#   ratio   웹툰 칸의 비율. "16:9"는 페이지 폭 한 줄, "3:4"는 둘이 나란히 한 줄.
#   narration  true면 누르지 않아도 줄이 저절로 찍히고 다 찍히면 다음 컷 (과거편).
#   sfx     컷이 뜨는 순간 한 번 나는 효과음 (schema.mjs의 CUT_SFX). radioSignOff는
#           0.8초 치지직 뒤 끊김.
#   holdMs  대사가 끝난 뒤 대사창 없이 그림만 남기는 시간(ms). 대사가 없는 컷
#           (lines: [])은 이 시간만큼 그림만 서 있다가 저절로 넘어간다.
#   lines   scripts.yaml과 같은 형태 (speaker / expression / ko / en / ja).
#
# 어떤 컷씬이 언제 도는지:
#   console-flashback  게임기 1차 (memories.yaml의 cutscene)
#   ball-flashback      공 1차 (memories.yaml의 cutscene)
#   radio-blackout      라디오 1차(재난방송)를 마친 순간 (store가 1바퀴 완주에 연다)
#   survivor-broadcast  라디오 2차 (memories.yaml의 cutscene)
#   trip-doubt          신발장 + 아빠 메일을 둘 다 본 순간 (store: tripDoubted)
#   p2-close            2페이즈 필수 조사를 다 마친 순간 (store: STORY_CUTSCENES)
#   p4-close            4페이즈 서류 순서 + 출입증을 마친 순간 (store: STORY_CUTSCENES)
#   still-beat          액자 2차 (memories.yaml의 cutscene)
#   bat-grip            현관 배트를 쥔 순간 (store의 takeBat)
#
# 컷씬 id를 바꾸면 src/data/memory-room.ts의 상수도 같이 고쳐야 한다.

cutscenes:
  #
  # 1페이즈 회상: 강도 1의 두 기억만. 결과 대사("받아줄 사람이 없다") 바로 뒤에
  # "받아주던 사람이 있던 때"를 한 장 세운다. 마지막 줄이 빈 방으로 돌아오는 자리다.
  # 뒤이은 라디오 컷씬들보다 가볍게: 그림 한 장, 대사 다섯 줄, 짧은 정적.
  # 강도 2부터(액자·폰)는 회상을 붙이지 않는다. 부모님 얼굴(액자 2차)과
  # 엄마 문자(폰 2차)의 보상을 먼저 써 버리기 때문이다.
  #
  # 주완(같은 반, 야구부 아님)과 2P로 격투 게임을 하던 때. 그림은 주완이 나간
  # 직후의 빈자리만 보이고, 사람은 나오지 않는다. 다섯 줄이 그림 위에 흐르고
  # 마지막 줄("언젠지 기억이 안 나네")이 빈 방으로 돌아오는 자리다.
  console-flashback:
    - image: /assets/images/mg-cutscene-console-flashback.webp?v=2
      holdMs: 1200
      lines:
        - speaker: hero
          ko: 게임은 같은 반 친구인 주완이와 자주 했었다.
        - speaker: hero
          ko: 시험 끝난 주에 자주 집에 놀러와서 2p로 격투 게임을 자주 플레이 했었다.
        - speaker: hero
          expression: smile
          ko: 내가 좀 더 많이 이겼었던 것 같다.
        - speaker: hero
          ko: 다음에는 캐릭터 바꿔서 하자고 했었지.
        - speaker: hero
          ko: …마지막으로 한 게 언젠지 기억이 안나네.

  #
  # 8강이 끝난 직후 홈플레이트. 해가 포수 등 뒤에 있어 얼굴이 역광에 묻힌다.
  # 보이는 건 미트 낀 손뿐이다: 엔딩 합류 컷(얼굴 대신 미트)과 짝이다 (docs/story.md).
  # 경기 끝을 알린 미트 소리가 방송 첫 칸의 탁, 탁(mittTap)과 이어지는 포수 복선이다.
  # 윤호의 생사·행방은 묻기만 하고 답하지 않는다.
  ball-flashback:
    - image: /assets/images/mg-cutscene-ball-flashback.webp?v=2
      holdMs: 1500
      lines:
        - speaker: hero
          ko: 야구를 오래해온 나는 야구로 유명한 청서고에 진학했다.
        - speaker: hero
          ko: 올해 있었던 전국 대회 8강에서는 근처 학교이자 야구 라이벌인 은강고와 맞붙게 되었다.
        - speaker: hero
          expression: smile
          ko: 2루수인 나는, 포수인 절친 윤호와 기합을 다졌었다.
        - speaker: hero
          ko: 하지만 결국 졌었지. 시합 종료를 알리는 은강고 포수의 마지막 미트 소리가 기억에 남는다.
        - speaker: hero
          ko: 윤호는 지금 뭘하고 있을까?

  #
  # 분기점 과거편 (docs/story.md 3장 분기점): 그날이 한 컷씩 지나간다.
  # 내레이션 컷(narration)은 누르지 않아도 줄마다 창을 비우고 타자기로 새로 찍히며, 다 찍히면
  # 다음 컷으로 넘어간다. 4컷(얼어붙은 얼굴)만 말 없이 1.5초 정적이다.
  # 끝나면 3D 방으로 돌아온다. 방은 가장 어둡고, BGM은 없고, 라디오는 빨갛게 깜빡인다.
  # 돌아와서 드는 혼잣말은 stages.yaml의 turn-bottom이다.
  radio-blackout:
    # 1컷: 교문 앞, 엄마 문자 미리보기
    - image: /assets/images/cutscene-day-1.webp?v=3
      narration: true
      lines:
        - speaker: hero
          ko: 그날은 평범한 날이었다.
        - speaker: hero
          ko: 부활동 끝나고 폰을 보니 엄마 문자가 와 있었다.
        - speaker: hero
          ko: '"오늘은 부활동 하지 말고 바로 집에 와." …이상한 말이었다.'
    # 2컷: 단지 안, 문 열린 채 버려진 차
    - image: /assets/images/cutscene-day-2.webp?v=2
      narration: true
      lines:
        - speaker: hero
          ko: 단지 안이 조용했다.
        - speaker: hero
          ko: 문이 열린 채 서 있는 차. 사람은 없었다.
        - speaker: hero
          ko: …사이렌 소리가 멀리서 났다.
    # 3컷: 엘리베이터 문틈의 감염자
    - image: /assets/images/cutscene-day-3.webp?v=2
      narration: true
      lines:
        - speaker: hero
          ko: 집 앞까지는 평소랑 똑같았다.
        - speaker: hero
          ko: 복도에 누가 서 있었다.
        - speaker: hero
          ko: 이상한 느낌이 들었다.
    # 4컷: 놀란 얼굴. 말 없이 정적
    - image: /assets/images/cutscene-day-4.webp?v=2
      holdMs: 1500
      lines: []
    # 5컷: 복도를 달림
    - image: /assets/images/cutscene-day-5.webp?v=3
      narration: true
      lines:
        - speaker: hero
          ko: 정신없이 달렸다.
        - speaker: hero
          ko: 뒤에서 나는 소리는 사람 소리가 아니었다.
    # 6컷: 현관에 주저앉음
    - image: /assets/images/cutscene-day-6.webp?v=2
      narration: true
      lines:
        - speaker: hero
          ko: 문을 잠갔다.
        - speaker: hero
          ko: 부모님은 여행 중이셨기에 집안엔 아무도 없었다.
        - speaker: hero
          ko: 급박했던 상황이 거짓이었던 듯 정적이 내려앉았다.
    # 7컷: TV 불빛에 무표정
    - image: /assets/images/cutscene-day-7.webp?v=2
      narration: true
      lines:
        - speaker: hero
          ko: 뉴스는 아직 나오고 있었다.
        - speaker: hero
          ko: 감염, 확산, 대피. 아나운서가 낯선 말들을 다급하게 외치고 있었다.
        - speaker: hero
          ko: 사방에서 들려오는 비명소리에 귀를 막았다.

  #
  # 생존자 방송: 3페이지 10칸 웹툰 (WebtoonViewer). 페이지 안에서 칸이 번호순으로
  # 떠오르고, 방송 대사는 대사창이 아니라 칸 안의 라디오 말풍선이다. 16:9 칸은 페이지
  # 폭 한 줄, 3:4 칸은 둘이 나란히 한 줄. 말풍선은 다 찍히면 0.6초 뒤, 대사 없는 칸은
  # holdMs 뒤 다음 칸. 화자 이름은 ??? 그대로다. 이름은 게임 안에서 부르지 않는다.
  # ①은 방송 전에 미트를 탁, 탁 두 번 치는 소리(mittTap, 실제 미트 소리 파일)를 낸다.
  # 1막 사인볼 회상의 "상대 포수가 미트를 탁탁, 두 번 치고 앉았다"와 이어지는 포수 복선. 대사 칸마다 짧은 라디오 노이즈,
  # ⑩에서 치지직 끊김. 웹툰이 걷히면 방에서 도해의 한마디가 대사창으로 흐른다.
  survivor-broadcast:
    # 1페이지
    - image: /assets/images/cutscene-survivor-1.webp?v=2
      page: 1
      ratio: "16:9"
      sfx: mittTap
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-2.webp?v=2
      page: 1
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-3.webp?v=3
      page: 1
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-4.webp?v=2
      page: 1
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 어이, 거기 누구 없어? …이거 나가긴 하는 거야?
    # 2페이지
    - image: /assets/images/cutscene-survivor-5.webp?v=2
      page: 2
      ratio: "3:4"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 생존자 있으면 들어. 우리 여기 모여 있어. 치료할 방법도 찾고 있고.
    - image: /assets/images/cutscene-survivor-6.webp?v=2
      page: 2
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-7.webp?v=2
      page: 2
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 나흘 밤 지나면 여기서 이동한다. 그 뒤엔 우리도 어디로 갈지 몰라.
    # 3페이지
    - image: /assets/images/cutscene-survivor-8.webp?v=2
      page: 3
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 다시 한번 말한다. 은강고 체육관으로 모여.
    - image: /assets/images/cutscene-survivor-9.webp?v=2
      page: 3
      ratio: "3:4"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: …늦지 말고 와.
    # 치지직: 방송이 끊긴다. 0.8초 끊김 뒤 웹툰이 걷힌다
    - image: /assets/images/cutscene-survivor-10.webp?v=3
      page: 3
      ratio: "3:4"
      sfx: radioSignOff
      holdMs: 1500
      lines: []
    # 방으로 돌아와서. 학교 이름은 재하를 가리키고, 목소리는 흐린 채 둔다:
    # "또래 남자"가 윤호나 주완일 수 있다는 여지 (속편 떡밥, 확인해 주지 않는다)
    - lines:
        - speaker: hero
          expression: surprised
          ko: 은강고…? 그때 그…?
        - speaker: hero
          ko: …목소리가 좀 익숙한데.
          en: …That voice sounds kind of familiar.
          ja: …なんか、聞き覚えのある声だな。

  #
  # 캐리어 개수 추리의 결론 (v4.1 3장). 신발장과 아빠 메일("2박 3일")을 둘 다 본 순간.
  trip-doubt:
    - lines:
        - speaker: hero
          ko: 2박 3일인데 캐리어가 두 개. 가져간 짐은 한 달치였어.

  #
  # 2페이즈를 닫는 한 줄. 그림 없이 방이 비친 채로 흐른다.
  p2-close:
    - lines:
        - speaker: hero
          ko: 여행이 아니었어. 둘 다 뭔가 알고 있었어.

  #
  # 4페이즈 서류와 출입증을 마친 뒤: 라디오의 "치료할 방법"과 앰플이 이어진다.
  # 이어서 각오를 한 번 더 다진다: 부모님의 진실 → 앰플 → 기한 안에 체육관. 목적을 잊지 않게.
  # 이 줄이 끝나면 방의 액자에 금빛이 돈다.
  p4-close:
    - lines:
        - speaker: hero
          ko: …이게 답일지도 몰라.
        - speaker: hero
          ko: 엄마 아빠는 이걸 지키려고 간 거였어. 여행이 아니라.
        - speaker: hero
          ko: 앰플을 들고, 나흘 안에 은강고 체육관으로 간다.

  #
  # 정적 비트: 액자 2차(얼굴이 돌아온 사진) 직후. BGM이 멎고 카메라가 머문 채
  # 몇 초가 흐른 뒤 한 줄. 액자를 세워 두는 연출이다. 끝나면 현관 배트에 금빛이 돈다.
  still-beat:
    - holdMs: 2600
      lines: []
    - lines:
        - speaker: hero
          ko: …갔다 올게.

  #
  # 현관의 배트를 쥔 순간. 대사가 끝나면(건너뛰어도) 스토어가 배트를 쥔 것으로
  # 기록하고, 그때부터 현관문이 열린다 (takeBat).
  bat-grip:
    - lines:
        - speaker: hero
          ko: 3년 쓴 배트다. 이걸로 공만 쳤는데.
          en: Three years with this bat. All I ever hit with it was a ball.
          ja: 三年使ったバットだ。これで打ったのはボールだけだったのに。
        - speaker: hero
          ko: …가자.
          en: …Let's go.
          ja: …行こう。
