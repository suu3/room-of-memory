# 컷씬: 일러스트 위로 대사가 흐르는 연출 (v4 설계서 3-3 · 3-6).
#
# 그림 안에 말풍선을 넣지 않는 것이 이 연출의 규칙이라, 대사는 컷씬 전용 창을
# 새로 만들지 않고 기존 대사창(DialogueBox)이 그대로 받는다. 컷씬이 도는 동안
# BGM은 멎는다 (selectMusicPlaying).
#
# 컷 하나의 형태:
#   image   일러스트 경로 (public 기준). 파일이 아직 없어도 회색 판이 자리를 지킨다.
#           없으면 그림 없이 방이 그대로 비친 채 대사창만 뜬다.
#   panel   left | right. 웹툰 컷: 판을 통째로 덮지 않고 그쪽 절반에 칸으로 선다.
#           앞 컷의 칸은 반대편에 남아, 좌우로 번갈아 들어오는 두 칸이 나란히 읽힌다.
#   sfx     컷이 뜨는 순간 한 번 나는 효과음 (schema.mjs의 CUT_SFX).
#   holdMs  대사가 끝난 뒤 대사창 없이 그림만 남기는 시간(ms). 대사가 없는 컷
#           (lines: [])은 이 시간만큼 그림만 서 있다가 저절로 넘어간다.
#   lines   scripts.yaml과 같은 형태 (speaker / expression / ko / en / ja).
#
# 어떤 컷씬이 언제 도는지:
#   radio-blackout      라디오 1차(재난방송)를 마친 순간 (store가 1바퀴 완주에 연다)
#   survivor-broadcast  라디오 2차 (memories.yaml의 cutscene)
#   trip-doubt          신발장 + 아빠 메일을 둘 다 본 순간 (store: tripDoubted)
#   p2-close            2페이즈 필수 조사를 다 마친 순간 (store: STORY_CUTSCENES)
#   p4-close            4페이즈 서류 순서 + 출입증을 마친 순간 (store: STORY_CUTSCENES)
#   still-beat          액자 2차 (memories.yaml의 cutscene)
#   bat-grip            현관 배트를 쥔 순간 (store의 takeBat)
#
# 컷씬 id를 바꾸면 src/data/memory-room.ts의 상수도 같이 고쳐야 한다.

cutscenes:
  #
  # 분기점의 이미지 나열: 그날이 한 장씩 지나간다. 말은 마지막 한 줄뿐이다.
  # 컷 사이에 대사가 없어 저절로 넘어간다 (holdMs). 그림이 들어오기 전에는 회색 판.
  # 끝나면 3D 방으로 돌아온다. 방은 가장 어둡고, BGM은 없고, 라디오는 빨갛게 깜빡인다.
  # 여섯 컷 (docs/story.md 3장 분기점): 하교길에 엄마 문자 미리보기 → 엘리베이터의 감염자
  # → 얼어붙은 얼굴 → 복도를 달림 → 잠근 현관에 주저앉음 → 불 꺼진 거실의 뉴스.
  # 첫 컷은 휴대폰 알림을 읽을 틈을 조금 더 준다.
  radio-blackout:
    - image: /assets/images/cutscene-day-1.webp
      holdMs: 2400
      lines: []
    - image: /assets/images/cutscene-day-2.webp
      holdMs: 1800
      lines: []
    - image: /assets/images/cutscene-day-3.webp
      holdMs: 1800
      lines: []
    - image: /assets/images/cutscene-day-4.webp
      holdMs: 1800
      lines: []
    - image: /assets/images/cutscene-day-5.webp
      holdMs: 1800
      lines: []
    - image: /assets/images/cutscene-day-6.webp
      lines:
        - speaker: hero
          ko: 그날 이후로 난 나가지 않고 있다. 어차피 나가 봐야 보이는 현실은 똑같으니까.

  #
  # 생존자 방송: 웹툰 컷이 좌우로 번갈아 들어온다. 첫 컷에 마이크를 탁, 탁 두 번
  # 두드리는 소리가 나고, 그림에도 의성어 "탁, 탁"이 그려진다 (무음으로 하는 사람도
  # 알아볼 수 있게). 화자 이름은 ??? 그대로다. 이름은 게임 안에서 부르지 않는다.
  survivor-broadcast:
    - image: /assets/images/cutscene-survivor-1.webp
      panel: left
      sfx: micTap
      lines:
        - speaker: signal
          ko: 아, 이거 나가긴 하는 거야?
    - image: /assets/images/cutscene-survivor-2.webp
      panel: right
      lines:
        - speaker: signal
          ko: 생존자 있으면 들어. 우리 여기 모여 있어. 치료할 방법도 찾고 있고.
    - image: /assets/images/cutscene-survivor-3.webp
      panel: left
      lines:
        - speaker: signal
          ko: 사흘 밤 지나면 여기서 이동한다. 그 뒤엔 우리도 어디로 갈지 몰라.
    - image: /assets/images/cutscene-survivor-4.webp
      panel: right
      lines:
        - speaker: signal
          ko: 다시 한번 말한다. 은강고 체육관으로 모여. …늦지 말고 와.
    # 치지직: 방송이 끊기고 방으로 돌아온다
    - sfx: radioCut
      lines:
        - speaker: hero
          expression: surprised
          ko: 은강고…? 그때 그…?

  #
  # 캐리어 개수 추리의 결론 (v4.1 3장). 신발장과 아빠 메일("2박 3일")을 둘 다 본 순간.
  trip-doubt:
    - lines:
        - speaker: hero
          ko: 2박 3일인데 캐리어가 두 개. 가져간 짐은 한 달치였어.

  #
  # 2페이즈를 닫는 한 줄. 그림 없이 방이 비친 채로 흐른다.
  p2-close:
    - lines:
        - speaker: hero
          ko: 여행이 아니었어. 둘 다 뭔가 알고 있었어.

  #
  # 4페이즈 서류와 출입증을 마친 뒤: 라디오의 "치료할 방법"과 앰플이 이어진다.
  # 이 줄이 끝나면 방의 액자에 금빛이 돈다.
  p4-close:
    - lines:
        - speaker: hero
          ko: …이게 답일지도 몰라.

  #
  # 정적 비트: 액자 2차(얼굴이 돌아온 사진) 직후. BGM이 멎고 카메라가 머문 채
  # 몇 초가 흐른 뒤 한 줄. 액자를 세워 두는 연출이다. 끝나면 현관 배트에 금빛이 돈다.
  still-beat:
    - holdMs: 2600
      lines: []
    - lines:
        - speaker: hero
          ko: …갔다 올게.

  #
  # 현관의 배트를 쥔 순간. 대사가 끝나면(건너뛰어도) 스토어가 배트를 쥔 것으로
  # 기록하고, 그때부터 현관문이 열린다 (takeBat).
  bat-grip:
    - lines:
        - speaker: hero
          ko: 3년 쓴 배트다. 이걸로 공만 쳤는데.
          en: Three years with this bat. All I ever hit with it was a ball.
          ja: 三年使ったバットだ。これで打ったのはボールだけだったのに。
        - speaker: hero
          ko: …가자.
          en: …Let's go.
          ja: …行こう。
