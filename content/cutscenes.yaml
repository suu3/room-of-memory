# 컷씬: 일러스트 위로 대사가 흐르는 연출 (v4 설계서 3-3 · 3-6).
#
# 그림 안에 말풍선을 넣지 않는 것이 이 연출의 규칙이라, 대사는 컷씬 전용 창을
# 새로 만들지 않고 기존 대사창(DialogueBox)이 그대로 받는다. 예외는 웹툰(page)
# 하나다: 생존자 방송은 라디오 말풍선이 칸 안에 선다. 컷씬이 도는 동안
# BGM은 멎는다 (selectMusicPlaying).
#
# 컷 하나의 형태:
#   image   일러스트 경로 (public 기준). 파일이 아직 없어도 회색 판이 자리를 지킨다.
#           없으면 그림 없이 방이 그대로 비친 채 대사창만 뜬다.
#   black   true면 검정 화면. 그림도 판도 없이 어둠 위에 대사창만 뜬다 (과거편의 마지막 컷).
#           image·page와 같이 못 쓴다.
#   page    웹툰 칸의 페이지(1부터). 있으면 웹툰 뷰어(WebtoonViewer)로 돈다: 페이지 안에서
#           칸이 번호순으로 떠오르고, 대사는 칸 안의 라디오 말풍선(한 줄)이다. 페이지 없는
#           컷은 맨 뒤에만: 웹툰이 걷힌 뒤 방에서 대사창으로 흐르는 한마디다.
#   ratio   웹툰 칸의 비율. "16:9"는 페이지 폭 한 줄, "3:4"는 둘이 나란히 한 줄.
#   shake   true면 그림이 서는 순간 판이 한 번 흔들린다 (덮쳐 오는 컷). 연달아 두지 않는다.
#   sfx     컷이 뜨는 순간 한 번 나는 효과음 (schema.mjs의 CUT_SFX). radioSignOff는
#           0.8초 치지직 뒤 끊김.
#   holdMs  대사가 끝난 뒤 대사창 없이 그림만 남기는 시간(ms). 대사가 없는 컷
#           (lines: [])은 이 시간만큼 그림만 서 있다가 저절로 넘어간다.
#   lines   scripts.yaml과 같은 형태 (speaker / expression / ko / en / ja).
#
# 어떤 컷씬이 언제 도는지:
#   console-flashback  게임기 1차 (memories.yaml의 cutscene)
#   ball-flashback      공 1차 (memories.yaml의 cutscene)
#   workbook-name       문제집 뒤표지의 이름을 보고 내려놓은 순간 (store의 closeClue)
#   radio-blackout      라디오 1차(재난방송)를 마친 순간 (store가 1바퀴 완주에 연다)
#   survivor-broadcast  라디오 2차 (memories.yaml의 cutscene)
#   trip-doubt          신발장 + 아빠 메일을 둘 다 본 순간 (store: tripDoubted)
#   p2-close            2페이즈 필수 조사를 다 마친 순간 (store: STORY_CUTSCENES)
#   p4-close            4페이즈 서류 순서 + 출입증을 마친 순간 (store: STORY_CUTSCENES)
#   still-beat          액자 2차 (memories.yaml의 cutscene)
#   bat-grip            현관 배트를 쥔 순간 (store의 takeBat)
#
# 컷씬 id를 바꾸면 src/data/memory-room.ts의 상수도 같이 고쳐야 한다.

cutscenes:
  #
  # 문제집 뒤표지에서 이름을 찾고 내려놓는 순간 (store의 closeClue). 그림 없이 방에서
  # 대사창만 흐른다. 도해가 누구인지를 처음으로 소리 내어 말하는 자리다.
  workbook-name:
    - lines:
        - speaker: hero
          ko: 수능 기출문제집. …한도해. 내 글씨다.
          en: Past entrance-exam questions. …Han Do-hae. That's my handwriting.
          ja: 入試の過去問題集。…ハン・ドヘ。俺の字だ。
        - speaker: hero
          ko: 여름 대회를 끝으로 야구부를 은퇴했다. 그 뒤로는 그냥 고3으로 돌아갔다.
          en: I retired from the baseball team after the summer tournament. After that, I went back to being just another senior.
          ja: 夏の大会を最後に野球部を引退した。それからは、ただの高三に戻った。
        - speaker: hero
          ko: 이것도 그때 샀다. 수험생 흉내라도 내 보려고.
          en: I bought this back then, too. Figured I'd at least act like a test-taker.
          ja: これもそのときに買った。受験生のふりくらいはしてみようって。

  #
  # 1페이즈 회상: 강도 1의 두 기억만. 결과 대사(혼자 이기고, 혼자 휘두른다) 바로 뒤에
  # "같이 하던 사람이 있던 때"를 한 장 세운다. 마지막 줄이 빈 방으로 돌아오는 자리다.
  # 뒤이은 라디오 컷씬들보다 가볍게: 그림 한 장, 대사 다섯 줄, 짧은 정적.
  # 강도 2부터(액자·폰)는 회상을 붙이지 않는다. 부모님 얼굴(액자 2차)과
  # 엄마 문자(폰 2차)의 보상을 먼저 써 버리기 때문이다.
  #
  # 주완(같은 반, 야구부 아님)과 2P로 격투 게임을 하던 때. 그림은 주완이 나간
  # 직후의 빈자리만 보이고, 사람은 나오지 않는다. 다섯 줄이 그림 위에 흐르고
  # 마지막 줄("언젠지 기억이 안 나네")이 빈 방으로 돌아오는 자리다.
  console-flashback:
    - image: /assets/images/mg-cutscene-console-flashback.webp?v=2
      holdMs: 1200
      lines:
        - speaker: hero
          ko: 주완이는 같은 반이었다. 야구부도 아닌데 제일 자주 붙어 다녔다.
          en: Juwan was in my class. He wasn't even on the baseball team, but he's the one I hung out with most.
          ja: ジュワンは同じクラスだった。野球部でもないのに、一番よくつるんでいた。
        - speaker: hero
          ko: 시험이 끝난 주엔 우리 집에 와서 2P로 격투 게임을 했다.
          en: The week exams ended, he'd come over to my place and we'd play fighting games in two-player mode.
          ja: テストが終わった週には、うちに来て2Pで格闘ゲームをした。
        - speaker: hero
          expression: smile
          ko: 지고 나면 걔는 꼭 한 판만 더 하자고 했다.
          en: Whenever he lost, he'd always ask for just one more round.
          ja: 負けると、あいつは決まってもう一戦だけやろうと言った。
        - speaker: hero
          ko: 다음에는 캐릭터 바꿔서 하자고 했었는데.
          en: We said we'd swap characters next time.
          ja: 次はキャラを交換してやろうって言ってたっけ。
        - speaker: hero
          ko: …마지막으로 한 게 언젠지 기억이 안 나네.
          en: …I can't remember the last time we played.
          ja: …最後にやったのがいつだったか、思い出せないな。

  #
  # 16강이 끝난 직후 홈플레이트. 해가 포수 등 뒤에 있어 얼굴이 역광에 묻힌다.
  # 보이는 건 미트 낀 손뿐이다: 엔딩 합류 컷(얼굴 대신 미트)과 짝이다 (docs/story/story.md).
  # 손바닥으로 미트를 두드리던 버릇의 소리가 방송 첫 칸의 탁, 탁(mittTap)과 이어지는 포수 복선이다.
  # 학교·포지션·윤호 소개는 게임 전 대사(ball-intro)가 먼저 깐다. 여기서는 그 타석의 끝
  # (은강고 포수가 뜬공을 잡아 경기가 끝난다)과 그 포수만 말한다.
  # 같이 뛴 친구들의 생사·행방은 묻기만 하고 답하지 않는다.
  ball-flashback:
    - image: /assets/images/mg-cutscene-ball-flashback.webp?v=3
      holdMs: 1500
      lines:
        - speaker: hero
          ko: 은강고는 바로 옆 동네 학교다. 만날 때마다 껄끄러운 상대였다.
          en: Eungang High is just one neighborhood over. They were a tough matchup every time we met.
          ja: 銀江高はすぐ隣の町の学校だ。当たるたびに、やりにくい相手だった。
        - speaker: hero
          ko: 9회 말 풀카운트. 빗맞은 공이 은강고 포수 뒤로 높이 떴다.
          en: Bottom of the ninth, full count. I got under it, and the ball popped up high behind Eungang's catcher.
          ja: 九回裏、フルカウント。打ち損じた球が、銀江高のキャッチャーの後ろへ高く上がった。
        - speaker: hero
          expression: sad
          ko: 그 녀석이 마스크를 벗어 던지고 달려가 잡았다. 그게 내 마지막 경기였다.
          en: He tossed his mask, ran it down, and caught it. That was my last game.
          ja: あいつがマスクを投げ捨てて走り、捕った。それが俺の最後の試合だった。
        - speaker: hero
          ko: 진 건 분했는데, 이상하게 그 포수가 미트를 탁탁 두드리던 소리만 귀에 남았다.
          en: Losing stung, but strangely, the only thing that stuck with me was the sound of that catcher slapping his mitt.
          ja: 負けたのは悔しかったのに、なぜかあのキャッチャーがミットをパンパンと叩く音だけが耳に残った。
        - speaker: hero
          ko: 그날 같이 뛴 애들은 지금 뭐 하고 있을까.
          en: I wonder what the guys I played with that day are doing now.
          ja: あの日一緒に戦ったみんなは今、何をしてるんだろう。

  #
  # 분기점 과거편 (docs/story/story.md 3장 분기점): 그날이 한 컷씩 지나간다.
  # 주파수를 잡은 라디오가 지직거리다 꺼지면(도입) 검정 화면 세 컷이 먼저 온다:
  # 노이즈뿐인 라디오 앞의 한 줄 → 정적 → 그날의 재난 방송. 방송이 흐르는 동안 화면 위
  # 혼잣말 자리에는 도해의 속말(whispers)이 번갈아 떴다 진다.
  # 과거편의 줄도 다른 대사처럼 눌러서 넘긴다 (오토를 켜면 저절로 흐른다). 덮쳐 오는 컷과
  # 얼어붙은 얼굴 컷만 말 없이 정적이다.
  # 마지막 컷은 검정 화면(black): 그날의 회상이 끝나고 "그날 이후"를 대사창으로 말한다.
  # 끝나면 3D 방으로 돌아온다. 방은 가장 어둡고, BGM은 없고, 라디오는 빨갛게 깜빡인다.
  # 돌아와서 드는 혼잣말은 stages.yaml의 turn-bottom (라디오에 다른 신호가 잡힌다).
  radio-blackout:
    # 꺼진 라디오 앞. 노이즈만 남았다
    - black: true
      lines:
        - speaker: hero
          expression: sad
          ko: 역시 노이즈뿐이다. …그날은 여기서 방송이 나왔었는데.
          en: Nothing but noise, as expected. …That day, there was a broadcast coming out of this thing.
          ja: やっぱりノイズだけだ。…あの日は、ここから放送が流れていたのに。
    # 정적
    - black: true
      holdMs: 2000
      lines: []
    # 그날의 재난 방송 (자동 반복 송출 톤). 위로는 도해의 속말이 떴다 진다
    - black: true
      whispers:
        - ko: …떠올리고 싶지 않아.
          en: …I don't want to remember.
          ja: …思い出したくない。
        - ko: 그만해…
          en: Stop…
          ja: やめてくれ…
        - ko: 겨우 덮어 뒀는데…
          en: I'd finally buried it…
          ja: やっと蓋をしたのに…
      lines:
        - speaker: broadcast
          ko: …긴급 재난 방송입니다. 원인을 알 수 없는 감염병이 발생했습니다. 국민 여러분은 즉시 실내로 대피하십시오.
          en: …This is an emergency broadcast. An infectious disease of unknown origin has broken out. All citizens must take shelter indoors immediately.
          ja: …緊急災害放送です。原因不明の感染症が発生しました。国民の皆さんは直ちに屋内へ避難してください。
        - speaker: broadcast
          ko: 감염 사태는 수도권을 넘어 남부 전역으로 확산되고 있습니다.
          en: The infection has spread past the capital region into the entire south.
          ja: 感染は首都圏を越え、南部全域へ拡大しています。
        - speaker: broadcast
          ko: 부산까지 감염 사태가 번졌습니다. …반복합니다. 긴급 재난 방송입니다.
          en: The infection has now reached Busan. …Repeat. This is an emergency broadcast.
          ja: 感染は釜山まで広がりました。…繰り返します。緊急災害放送です。
        - speaker: hero
          expression: sad
          ko: …맞아. 그날이었다.
          en: …Right. It was that day.
          ja: …そうだ。あの日だった。
    # 교문 앞, 엄마 문자 미리보기
    - image: /assets/images/cutscene-day-1.webp?v=3
      lines:
        - speaker: hero
          ko: 그날은 평범한 날이었다.
          en: It was an ordinary day.
          ja: あの日は、普通の日だった。
        - speaker: hero
          ko: 보충수업 끝나고 폰을 보니 엄마 문자가 와 있었다.
          en: After extra classes, I checked my phone and there was a text from Mom.
          ja: 補習が終わってスマホを見ると、母さんからメッセージが来ていた。
        - speaker: hero
          ko: '"오늘은 독서실 가지 말고 바로 집에 와." …평소엔 안 하던 말이었다.'
          en: '"Skip the study room today and come straight home." …Not something she usually said.'
          ja: 「今日は自習室に行かないで、まっすぐ帰ってきて。」…普段は言わないことだった。
    # 2컷: 단지 안, 문 열린 채 버려진 차
    - image: /assets/images/cutscene-day-2.webp?v=2
      lines:
        - speaker: hero
          ko: 단지 안이 조용했다.
          en: The apartment complex was quiet.
          ja: 団地の中が静かだった。
        - speaker: hero
          ko: 문이 열린 채 서 있는 차. 사람은 없었다.
          en: A car sitting there with its door open. No one around.
          ja: ドアが開いたまま止まっている車。人はいなかった。
        - speaker: hero
          ko: …멀리서 사이렌 소리가 들렸다.
          en: …Sirens wailed in the distance.
          ja: …遠くでサイレンが鳴っていた。
        - speaker: hero
          ko: 그래도 집 앞까지는 아무 일 없었다.
          en: Still, nothing happened all the way to my door.
          ja: それでも、家の前までは何事もなかった。
    # 3컷: 복도 끝에 서 있는 감염자
    - image: /assets/images/cutscene-day-3.webp?v=3
      lines:
        - speaker: hero
          ko: 복도에 누가 서 있었다.
          en: Someone was standing in the hallway.
          ja: 廊下に誰かが立っていた。
        - speaker: hero
          ko: …서 있는 모양이 이상했다.
          en: …Something about the way they stood was off.
          ja: …立ち方が、どこかおかしかった。
    # 4컷: 손을 뻗으며 덮쳐 오는 감염자. 말 없이 정적
    - image: /assets/images/cutscene-day-4.webp?v=3
      shake: true
      holdMs: 1200
      lines: []
    # 5컷: 놀란 얼굴. 말 없이 정적
    - image: /assets/images/cutscene-day-5.webp?v=4
      holdMs: 1500
      lines: []
    # 6컷: 복도를 달림
    - image: /assets/images/cutscene-day-6.webp?v=4
      lines:
        - speaker: hero
          ko: 정신없이 달렸다.
          en: I ran without thinking.
          ja: 無我夢中で走った。
        - speaker: hero
          ko: 뒤에서 나는 소리는 사람 소리가 아니었다.
          en: The sounds behind me weren't human.
          ja: 後ろから聞こえる音は、人の声じゃなかった。
    # 7컷: 현관에 주저앉음
    - image: /assets/images/cutscene-day-7.webp?v=3
      lines:
        - speaker: hero
          ko: 문을 잠갔다.
          en: I locked the door.
          ja: ドアに鍵をかけた。
        - speaker: hero
          ko: 부모님은 여행 중이었다. 집에는 아무도 없었다.
          en: Mom and Dad were away on their trip. There was no one home.
          ja: 両親は旅行中だった。家には誰もいなかった。
        - speaker: hero
          ko: 방금 일이 거짓말 같을 만큼 조용했다.
          en: It was so quiet that what had just happened felt like a lie.
          ja: さっきのことが嘘みたいに、静かだった。
    # 8컷: TV 불빛에 무표정
    - image: /assets/images/cutscene-day-8.webp
      lines:
        - speaker: hero
          ko: TV를 켜니 뉴스가 나오고 있었다.
          en: I turned on the TV, and the news was on.
          ja: テレビをつけると、ニュースが流れていた。
        - speaker: hero
          ko: 감염, 확산, 대피. 아나운서가 낯선 말들을 다급하게 쏟아 내고 있었다.
          en: Infection, spread, evacuation. The anchor was rattling off unfamiliar words in a panic.
          ja: 感染、拡大、避難。アナウンサーが聞き慣れない言葉を慌ただしくまくし立てていた。
        - speaker: hero
          ko: 사방에서 비명이 들렸다. 귀를 막았다.
          en: Screams came from every direction. I covered my ears.
          ja: 四方から悲鳴が聞こえた。耳をふさいだ。
    # 9컷: 검정 화면. 그날에서 지금으로 건너오는 두 줄
    - black: true
      lines:
        - speaker: hero
          ko: 그날 이후로 나는 집 밖에 나가지 않았다.
          en: Ever since that day, I haven't set foot outside.
          ja: あの日から、俺は家の外に出ていない。
        - speaker: hero
          ko: 나가서 마주할 현실이 두려워서.
          en: Because I was afraid of what I'd have to face out there.
          ja: 外に出て向き合う現実が怖くて。

  #
  # 생존자 방송: 3페이지 10칸 웹툰 (WebtoonViewer). 페이지 안에서 칸이 번호순으로
  # 떠오르고, 방송 대사는 대사창이 아니라 칸 안의 라디오 말풍선이다. 16:9 칸은 페이지
  # 폭 한 줄, 3:4 칸은 둘이 나란히 한 줄. 말풍선은 다 찍히면 0.6초 뒤, 대사 없는 칸은
  # holdMs 뒤 다음 칸. 화자 이름은 ??? 그대로다. 이름은 게임 안에서 부르지 않는다.
  # ①은 방송 전에 미트를 탁, 탁 두 번 치는 소리(mittTap, 실제 미트 소리 파일)를 낸다.
  # 1막 야구공 회상의 "상대 포수가 손바닥으로 미트를 탁탁, 두 번 두드리고 앉았다"와 이어지는 포수 복선. 대사 칸마다 짧은 라디오 노이즈,
  # ⑩에서 치지직 끊김. 웹툰이 걷히면 방에서 도해의 한마디가 대사창으로 흐른다.
  survivor-broadcast:
    # 1페이지
    - image: /assets/images/cutscene-survivor-1.webp?v=2
      page: 1
      ratio: "16:9"
      sfx: mittTap
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-2.webp?v=2
      page: 1
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-3.webp?v=3
      page: 1
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-4.webp?v=4
      page: 1
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 아, 아. 거기 누구 없어? …이거 나가긴 하는 건가.
          en: Testing, testing. Anyone out there? …Is this thing even transmitting?
          ja: あー、あー。誰かいないか? …これ、ちゃんと届いてんのかな。
    # 2페이지
    - image: /assets/images/cutscene-survivor-5.webp?v=2
      page: 2
      ratio: "3:4"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 여기 은강고 체육관에 생존자들 모여 있어.
          en: We've got survivors gathered here at the Eungang High gym.
          ja: ここ、銀江高の体育館に生存者が集まってる。
    - image: /assets/images/cutscene-survivor-6.webp?v=3
      page: 2
      ratio: "3:4"
      holdMs: 1500
      lines: []
    - image: /assets/images/cutscene-survivor-7.webp?v=2
      page: 2
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 방송실 장비에 송신기 물려서 쏘는 거라 멀리는 안 가. 이 동네면 들릴 거야.
          en: I hooked a transmitter up to the broadcast room gear, so it won't reach far. You'll hear it around here, though.
          ja: 放送室の機材に送信機をつないで飛ばしてるから、遠くまでは届かない。この辺なら聞こえるはずだ。
    # 3페이지
    - image: /assets/images/cutscene-survivor-8.webp?v=6
      page: 3
      ratio: "16:9"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 나흘 밤 지나면 우린 여기 떠나. 헬기가 뜬다는 얘기가 있어.
          en: After four nights, we're leaving here. Word is a helicopter's coming.
          ja: 四日後の夜、俺たちはここを出る。ヘリが飛ぶって話がある。
    - image: /assets/images/cutscene-survivor-9.webp?v=2
      page: 3
      ratio: "3:4"
      sfx: radioStatic
      lines:
        - speaker: signal
          ko: 그러니까 듣고 있는 사람 있으면 은강고 체육관으로 와. …늦지 마.
          en: So if anyone's listening, come to the Eungang High gym. …Don't be late.
          ja: だから、聞いてるやつがいたら銀江高の体育館に来い。…遅れるな。
    # 치지직: 방송이 끊긴다. 0.8초 끊김 뒤 웹툰이 걷힌다
    - image: /assets/images/cutscene-survivor-10.webp?v=3
      page: 3
      ratio: "3:4"
      sfx: radioSignOff
      holdMs: 1500
      lines: []
    # 방으로 돌아와서. 학교 이름은 재하를 가리키고, 목소리는 흐린 채 둔다:
    # "또래 남자"가 윤호나 주완일 수 있다는 여지 (속편 떡밥, 확인해 주지 않는다)
    - lines:
        - speaker: hero
          expression: surprised
          ko: 은강고…? 그때 그…?
          en: Eungang High…? That guy from back then…?
          ja: 銀江高…? あのときの…?
        - speaker: hero
          ko: …어디서 들어 본 목소리인데.
          en: …I've heard that voice somewhere.
          ja: …どこかで聞いたことのある声だな。

  #
  # 캐리어 개수 추리의 결론 (v4.1 3장). 신발장과 아빠 메일("2박 3일")을 둘 다 본 순간.
  # 냉장고(한 달 먹고 반) → 신발장(캐리어 둘, 등산화는 집에) → 아빠 메일(2박 3일)을 한 줄씩 잇는다
  trip-doubt:
    - lines:
        - speaker: hero
          expression: puzzled
          ko: 냉장고 안 음식은 한 달을 먹고도 반이 남았다.
          en: I've been eating from the fridge for a month, and it's still half full.
          ja: 冷蔵庫の食べ物は、ひと月食べてもまだ半分残っている。
        - speaker: hero
          expression: puzzled
          ko: 캐리어는 두 개나 가져가셨는데, 등산화는 두고 가셨다.
          en: They took two whole suitcases, but left Dad's hiking boots behind.
          ja: スーツケースは二つも持っていったのに、登山靴は置いていった。
        - speaker: hero
          ko: 2박 3일이라고 했는데. …2박 3일 치 짐이 아니었어.
          en: They said two nights. …That wasn't two nights' worth of luggage.
          ja: 二泊三日って言ってたのに。…二泊三日分の荷物じゃなかった。

  #
  # 2페이즈를 닫는 한 줄. 그림 없이 방이 비친 채로 흐른다.
  p2-close:
    - lines:
        - speaker: hero
          ko: …여행이 아니었던 걸까. 둘 다 뭔가 알고 있었어.
          en: …Was it not a trip at all? They both knew something.
          ja: …旅行じゃなかったのか。二人とも何か知ってたんだ。

  #
  # 4페이즈 서류와 출입증을 마친 뒤: 서류의 "치료제 후보"와 냉장고의 앰플이 이어진다.
  # 깨달음에서 멈춘다. "간다"는 여기서 말하지 않는다: 이 뒤에 악보 조각과 피아노, 액자가
  # 남아 있어서, 결심을 먼저 말하면 그 걸음들이 딴짓이 된다 (2026-10-05에 still-beat로 옮겼다).
  # 이 줄이 끝나면 안방 책상의 악보 조각에 금빛이 돈다.
  p4-close:
    - lines:
        - speaker: hero
          ko: …그 앰플이 답일지도 몰라.
          en: …That ampoule might be the answer.
          ja: …あのアンプルが答えかもしれない。
        - speaker: hero
          ko: 엄마 아빠는 나를 지키려고 여행이라고 한 거였어. …그리고 그걸 남기고 갔어.
          en: Mom and Dad called it a trip to protect me. …And they left that behind.
          ja: 父さんと母さんは、俺を守るために旅行だと言ったんだ。…そして、あれを残していった。

  #
  # 정적 비트: 액자 2차(얼굴이 돌아온 사진) 직후. BGM이 멎고 카메라가 머문 채
  # 몇 초가 흐른 뒤, 가족사진 앞에서 결심을 말한다: 진실(서류) → 어릴 때 치던 곡(피아노)
  # → 사진 → 간다. 액자를 세워 두는 연출이다. 끝나면 현관 배트에 금빛이 돈다.
  still-beat:
    - holdMs: 2600
      lines: []
    - lines:
        - speaker: hero
          ko: 앰플을 들고, 나흘 밤 안에 은강고 체육관으로 간다.
          en: I'm taking the ampoule and getting to the Eungang High gym within four nights.
          ja: アンプルを持って、四日のうちに銀江高の体育館へ行く。
        - speaker: hero
          ko: …갔다 올게.
          en: …I'll be back.
          ja: …行ってきます。

  #
  # 현관의 배트를 쥔 순간. 대사가 끝나면(건너뛰어도) 스토어가 배트를 쥔 것으로
  # 기록한다 (takeBat). 배트는 떠나기 전 챙길 것 셋(가방·앰플·배트) 중 하나라, 셋을 다
  # 챙겨야 현관문이 열린다. "나가자."는 그때 위쪽 혼잣말(stages.yaml resolve-ready)이 맡는다.
  bat-grip:
    - lines:
        - speaker: hero
          ko: 3년 쓴 배트다. 이걸로 공만 쳤는데.
          en: Three years with this bat. All I ever hit with it was a ball.
          ja: 三年使ったバットだ。これで打ったのはボールだけだったのに。
        - speaker: hero
          ko: …이것도 가져간다.
          en: …This comes too.
          ja: …これも持っていく。
