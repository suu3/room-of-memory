# 진행도별 독백: 화면 상단에 타자기로 찍히는 혼잣말 (src/components/ui/Monologue.tsx).
#
# 어느 줄을 쓸지는 monologueIdFor(src/data/monologue.ts)가 정한다. 페이즈(v4 설계서 1-1)와
# 1페이즈 안의 강도 단계를 본다 (v4 설계서 4-1).
#
#   p0-dark      intro. 불 켜기 전 어둠 속 한 줄
#   p1-0         p1, 강도 1 (처음부터)
#   p1-mid       p1, 강도 2 진입 (게임기·공을 다 본 뒤)
#   p1-late      p1, 강도 3 진입 (넷 이상 본 뒤)
#   turn-bottom  turning, 생존자 방송 전. 과거편에서 돌아온 방, 빨갛게 깜빡이는 라디오 앞의 한 줄
#   turn-signal  turning, 방송을 들은 뒤 문이 열리기 전
#   p2-enter     p2 진입. 기한 "나흘 밤 안에 가야 해."
#   p3-enter     p3 진입. 엄마가 숨긴 것을 쫓는다
#   p4-enter     p4 진입. 사태 이후 처음 들어서는 안방
#   resolve      정적 비트 뒤. 현관으로
#
# 방송부터 현관까지는 전부 하루 안의 일이다. 페이즈가 넘어가도 날은 바뀌지 않는다.
#
# 배경 그라디언트·글로우 세기 같은 시각값은 대본이 아니라 디자인 토큰이라
# src/data/memory-room.ts의 ROOM_STAGES에 그대로 있다.

stages:
  p0-dark:
    monologue:
      ko: …또 잠들었었나. 어둡다.
      en: …Did I doze off again. It's dark.
      ja: …また寝てたのか。暗い。

  p1-0:
    monologue:
      ko: 뭐부터 할까.
      en: What should I start with.
      ja: 何からやろうか。

  p1-mid:
    monologue:
      ko: 방이 좀 어둡네. …아니다, 원래 이랬나.
      en: The room's a little dark. …No, it's always been like this, hasn't it.
      ja: 部屋がちょっと暗いな。…いや、元からこうだったか。

  p1-late:
    monologue:
      ko: 하나씩 보다 보니까 자꾸 그날이… 됐어, 그만.
      en: Going through them one by one keeps bringing that day back… Enough. Stop.
      ja: 一つずつ見てると、あの日のことが…いい、やめよう。

  # 과거편 컷씬이 끝나고 3D 방으로 돌아온 순간. "그날 이후" 두 줄은 컷씬의 마지막 검정 컷
  # (cutscenes.yaml radio-blackout 8컷)이 대사창으로 말한다. 여기는 그 뒤, 라디오가 빨갛게
  # 깜빡이는 걸 알아채는 혼잣말이다. 재난방송은 자동 반복이었는데 그게 아닌 신호가 든다.
  turn-bottom:
    monologue:
      ko: …그럴 리가 없는데. 라디오에 다른 신호가 잡힌다.

  turn-signal:
    monologue:
      ko: 은강고 체육관. …문 쪽이 밝아.

  p2-enter:
    monologue:
      ko: 나흘 밤 안에 가야 해.

  p3-enter:
    monologue:
      ko: 엄마가 숨긴 게 더 있어.

  p4-enter:
    monologue:
      ko: 안방. 그날 이후로 처음 들어온다.

  resolve:
    monologue:
      ko: 가방, 앰플. 배트는 현관에 있다.
