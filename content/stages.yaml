# 진행도별 독백: 화면 상단에 타자기로 찍히는 혼잣말 (src/components/ui/Monologue.tsx).
#
# 어느 줄을 쓸지는 monologueIdFor(src/data/monologue.ts)가 정한다. 밝기 단계(dark/dim/gold)가
# 아니라 **조사 개수**를 본다. 기억 0개일 때와 6개일 때가 같은 말이면 방이 변하는데 사람만
# 그대로인 것처럼 읽힌다 (docs/content-design.md 7-2: "(0/n), (2/n), (4/n) … 단계에 따라 바뀐다").
#
#   p0-dark 인트로 (불 켜기 전)       어둠 속 한 줄. 스위치를 켜면 p1-0으로
#   p1-0   1바퀴 시작 (0개)          밝게
#   p1-1   1바퀴 1~2개              말끝이 살짝 흐려진다
#   p1-3   1바퀴 3~4개              생각을 피하는 지점이 드러난다
#   p1-5   1바퀴 5~6개              꺾인다 ("…아니다, 됐어.")
#   p1-7   1바퀴 7개 = 바닥          가장 어두운 한 줄. 라디오 목소리를 잡기 전까지만 뜬다
#   p2-0   목소리를 잡았다, 문은 아직  조심스러운 희망. 문이 열리면(2바퀴 시작) 아래로 넘어간다
#   p2-1   2바퀴 1~3개              나갈 준비
#   p2-4   2바퀴 4~7개              피하던 것을 스스로 입에 올린다
#   p2-8   2바퀴 8~10개             확신 ("…해볼까?")
#   p2-11  2바퀴 완주               짧고 단단하다
#
# 배경 그라디언트·글로우 세기 같은 시각값은 대본이 아니라 디자인 토큰이라
# src/data/memory-room.ts의 ROOM_STAGES에 그대로 있다.

stages:
  p0-dark:
    monologue:
      ko: 어둡다. …지금 몇 시지.
      en: It's dark. …What time is it.
      ja: 暗い。…今、何時だろう。

  p1-0:
    monologue:
      ko: 지금 몇 시지. 뭐부터 할까.
      en: What time is it. What should I start with.
      ja: 今、何時だろう。何からやろうか。

  p1-1:
    monologue:
      ko: 방이 좀 어둡네. …아니다, 원래 이랬나.
      en: The room's a little dark. …No, it's always been like this, hasn't it.
      ja: 部屋がちょっと暗いな。…いや、元からこうだったか。

  p1-3:
    monologue:
      ko: 하나씩 보다 보니까 자꾸 그날이… 됐어, 그만.
      en: Going through them one by one keeps bringing that day back… Enough. Stop.
      ja: 一つずつ見てると、あの日のことが…いい、やめよう。

  p1-5:
    monologue:
      ko: 몇 개 안 남았다. …아니다, 됐어.
      en: Only a few left. …No. Forget it.
      ja: あと少しだ。…いや、もういい。

  p1-7:
    monologue:
      ko: 다 봤는데, 방은 더 어두워졌다.
      en: I have seen all of it, and the room only got darker.
      ja: 全部見たのに、部屋はもっと暗くなった。

  p2-0:
    monologue:
      ko: …방금, 진짜 사람 목소리였어. 문 쪽이 밝아.
      en: …That was a real voice just now. The door side is bright.
      ja: …今の、本物の人の声だった。ドアのほうが明るい。

  p2-1:
    monologue:
      ko: 나갈 준비부터 하자. 뭐라도, 해보자.
      en: Let's start by getting ready to leave. Anything. Let's try.
      ja: まず出る準備からだ。何でもいい、やってみよう。

  p2-4:
    monologue:
      ko: …그때 아빠가 그랬잖아. 이상했어, 그 여행.
      en: …Dad said it back then. That trip was strange.
      ja: …あのとき父さんがそう言ってた。おかしかったんだ、あの旅行。

  p2-8:
    monologue:
      ko: 거짓말이었어. 근데 나를 위해서였다. …해볼까?
      en: It was a lie. But it was for me. …Should I try?
      ja: 嘘だった。でも、俺のためだった。…やってみるか？

  p2-11:
    monologue:
      ko: 다시 보니 다르게 보이네. 이제 나가자.
      en: It looks different the second time. Time to go.
      ja: 見直すと違って見える。もう行こう。
