# 진행도별 독백: 화면 상단에 타자기로 찍히는 혼잣말 (src/components/ui/Monologue.tsx).
#
# 어느 줄을 쓸지는 monologueIdFor(src/data/monologue.ts)가 정한다. 페이즈(v4 설계서 1-1)와
# 1페이즈 안의 강도 단계를 본다 (v4 설계서 4-1).
#
#   p0-dark      intro. 불 켜기 전 어둠 속 한 줄
#   p1-0         p1, 강도 1 (처음부터)
#   p1-mid       p1, 강도 2 진입 (게임기·공을 다 본 뒤)
#   p1-late      p1, 강도 3 진입 (넷 이상 본 뒤)
#   turn-silence turning, 신호가 잡히기 전. 과거편에서 돌아온 방, 라디오를 끄고 가라앉는 한 줄
#   turn-bottom  turning, 생존자 방송 전. 신호가 잡혀 빨갛게 깜빡이는 라디오 앞의 한 줄
#   turn-signal  turning, 방송을 들은 뒤 문이 열리기 전
#   p2-enter     p2 진입. 기한은 알지만, 아직 나갈 자신은 없다
#   p3-enter     p3 진입. 엄마가 숨긴 것을 쫓는다
#   p4-enter     p4 진입. 사태 이후 처음 들어서는 안방
#   resolve      정적 비트 뒤. 챙길 것 셋(가방·앰플·배트)을 부른다
#   resolve-ready  셋을 다 챙겼다. 알림 대신 결심 한 줄로 현관을 가리킨다
#
# 방송부터 현관까지는 전부 하루 안의 일이다. 페이즈가 넘어가도 날은 바뀌지 않는다.
#
# 방의 밝기 같은 시각값은 대본이 아니라 씬이 정한다
# (src/scenes/memory-room/visual-state.ts).

stages:
  p0-dark:
    monologue:
      ko: …또 잠들었나. 어둡다.
      en: …Did I fall asleep again? It's dark.
      ja: …また寝てたのか。暗い。

  p1-0:
    monologue:
      ko: 뭐부터 할까.
      en: Where should I start?
      ja: 何からやろうか。

  p1-mid:
    monologue:
      ko: 방이 어두워진 것 같다.
      en: "The room seems to have gotten darker."
      ja: "部屋が暗くなった気がする。"

  p1-late:
    monologue:
      ko: 하나씩 보다 보니 자꾸 그날이 떠오른다.
      en: Going through things one by one, that day keeps coming back to me.
      ja: 一つずつ見ていると、あの日のことが何度も浮かんでくる。

  # 과거편 컷씬이 끝나고 3D 방으로 돌아온 순간. "그날 이후" 두 줄은 컷씬의 마지막 검정 컷
  # (cutscenes.yaml radio-blackout의 마지막 컷)이 대사창으로 말한다. 여기는 그 뒤의 정적이다:
  # 라디오는 꺼져 있고 BGM도 없다. 과거편 TV 컷 "귀를 막았다"처럼 도해가 스스로 닫아 거는 한 줄이다.
  # 정적은 약 9초, 또는 뭔가를 만지면 조금 뒤에 끝나고 라디오가 저 혼자 지직거린다 (SignalCatch).
  turn-silence:
    monologue:
      ko: 떠올리고 싶지 않아. 마주하고 싶지 않아.
      en: I don't want to remember. I don't want to face it.
      ja: 思い出したくない。向き合いたくない。

  # 정적 끝에 꺼 둔 라디오가 저 혼자 깨어난다. 재난방송은 자동 반복이었는데 그게 아닌 신호가 든다.
  # "그럴 리가 없는데"는 꺼 둔 라디오라서 선다.
  turn-bottom:
    monologue:
      ko: …그럴 리가 없는데. 라디오에 다른 신호가 잡혀.
      en: …That can't be right. The radio's picking up a different signal.
      ja: …そんなはずないのに。ラジオが別の信号を拾ってる。

  turn-signal:
    monologue:
      ko: 은강고 체육관이라고 했지.
      en: The Eungang High gym, they said.
      ja: 銀江高の体育館って言ってたよな。

  p2-enter:
    monologue:
      ko: 나흘 밤. 그 안에 나갈 수 있을까.
      en: Four nights. Can I bring myself to leave by then?
      ja: 四日。その間に、外に出られるだろうか。

  p3-enter:
    monologue:
      ko: 부모님이 숨긴 게 더 있어.
      en: My parents were hiding something else.
      ja: 父さんと母さんが隠したものが、まだある。

  p4-enter:
    monologue:
      ko: 부모님이 쓰시던 안방. 그날 이후로 처음 열어 본다.
      en: Mom and Dad's bedroom. First time I've opened it since that day.
      ja: 父さんと母さんが使っていた寝室。あの日以来、初めて開ける。

  resolve:
    monologue:
      # "가방, 앰플. 배트는 현관에 있다."였다. 픽셀 글꼴에서 마침표가 쉼표처럼 보여 셋 다 현관에
      # 있다는 말로 읽혔다. 가방·앰플은 거실에 있다. 찾기 어려운 배트만 자리를 짚는다
      ko: 가방이랑 앰플부터 챙기자. 배트는 현관에 세워 뒀다.
      en: Bag, ampoule. The bat's by the front door.
      ja: バッグ、アンプル。バットは玄関にある。

  resolve-ready:
    monologue:
      ko: 나가자.
      en: Time to go.
      ja: 出よう。
