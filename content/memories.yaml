# 기억 오브젝트: 목록·순서·해금 조건·인터랙션 흐름 (v4 설계서).
#
# 이 파일이 게임 진행의 뼈대다. 여기 적힌 순서가 기억 패널에 뜨는 순서이고,
# unlockAfter와 from이 "무엇을 먼저 해야 열리는가"를 정한다.
#
# 고치고 나면 `pnpm content:build`. 어드민(dev 서버의 /admin)에서 저장하면 자동으로 돈다.
#
# ── 페이즈 (저장하지 않고 진행에서 파생된다: src/data/story-phase.ts) ─────────────
#
#   intro    불 꺼진 방. 스위치를 켜면 p1
#   p1       방 조사. 강도 1 → 2 → 3 → 라디오(관문). 1차 조사(phase1)가 여기 산다
#   turning  라디오 1차를 마친 뒤. 빨간 라디오 → 생존자 방송 → 방문 금빛
#   p2       방문을 연 뒤. 거실 넷 + 컴퓨터 로그인 → 엄마 대화방
#   p3       p2 필수 조사를 다 마치면. 앰플 → 컴퓨터 로고 매칭 → 하부장(11) → 안방 열쇠
#   p4       안방 문을 연 뒤. 서류 셋 → 액자 2차 → 정적 비트
#   resolve  정적 비트 뒤. 현관 배트 → 문
#   ending   현관문을 연 순간
#
# p2 → p3, p4 → resolve 전이는 그 페이즈의 필수 조사(from이 그 페이즈이고 side가
# 아닌 것)를 전부 마치는 것이다. 하부장·안방 문은 기억이 아니라 퍼즐·문이라 여기 없다
# (src/data/room-clues.ts의 PUZZLE_IDS, src/data/doors.ts).
#
# 배트는 여기 없다. 현관에 세워진 배트는 모으는 물건이 아니라 resolve에 켜지는
# 트리거다 (layout의 BAT_PLACEMENT, scenes의 EndingTrigger).
#
# ── 한 항목의 형태 ────────────────────────────────────────────────────────────
#   id            기억 id. 코드·에셋·i18n 키가 전부 이 값을 쓴다.
#   icon          기억 패널 아이콘. @phosphor-icons/react 이름 (schema.mjs의 허용 목록).
#   lore          수첩에 남는 기록. 있는 차수(phase1/2/3)마다 하나씩.
#   phase1        1차 조사 (p1).
#   phase2        2차 조사. from이 열리는 페이즈를 정한다.
#   phase3        3차 조사: 2차를 마친 뒤의 되짚기 (지금은 컴퓨터 하나).
#
# 차수 안의 형태:
#   script        미니게임 앞에 트는 진입 대사 (scripts.yaml의 id)
#   minigame      미니게임 id (src/minigames/index.ts 레지스트리)
#   resultScript  미니게임 클리어 뒤의 결과 대사 (scripts.yaml의 id)
#   resultMusic   결과 대사 동안 방 곡 대신 트는 곡. 지금은 `title`(타이틀 곡) 하나.
#                 타이틀에서 들은 곡이 게임 안에서 돌아오는 자리라 아껴 쓴다: 회상이
#                 가장 짙은 두 곳(액자 1차, 엄마의 마지막 문자)에만 건다. 곡이 없는
#                 구간(전환, 안방 p4)에서는 걸어도 들리지 않는다
#   unlockAfter   먼저 끝나야 하는 조사. `radio`는 같은 차수, `computer@3`은 3차
#   from          이 페이즈부터 열린다 (turning/p2/p3/p4). 2차 이후에 필수
#   side          곁가지: true면 페이즈를 넘기는 데 필요 없다
#   cutscene      이 조사를 마치는 순간 트는 컷씬 (cutscenes.yaml의 id)
#   replayStill   다시보기에서 대사 뒤에 세우는 정지 그림 (public 기준 경로).
#                 아직 비어 있는 칸과 거기에 무엇을 그릴지는 docs/replay-stills.md
#
# 대사·미니게임·컷씬이 다 없으면 클릭 즉시 완료된다.

memories:
  # ─────────────────────────────────────────────── 1페이즈 · 강도 0 (문제집 뒤)
  #
  # 야구 회상보다 먼저 "누구의 방인가"를 깐다: 고3, 수능 한 달 전, 부모님.
  # 문제집(이름)을 뒤집은 뒤 가장 먼저 열리는 기억이고, 강도 1(게임기·공)은 이것 뒤에 열린다.
  # 재난의 힌트는 결과 대사 끝 한 줄("…이었나")로만 샌다.
  - id: report-card
    icon: Exam
    lore:
      title:
        ko: 9월 모의고사
        en: September Mock Exam
        ja: 9月の模試
      phase1:
        ko: 성적은 좋지 않았다. 엄마는 과외 얘기를 꺼냈고, 아빠는 공부가 인생의 답은 아니라고 했다. 야구 대회가 끝나고 남은 건 수능이었다.
        en: My scores weren't good. Mom brought up getting a tutor, and Dad said studying isn't the answer to everything. With the baseball tournament over, all that was left was the entrance exam.
        ja: 成績は良くなかった。母さんは家庭教師の話を持ち出して、父さんは勉強だけが人生の答えじゃないと言った。野球の大会が終わって、残ったのは受験だけだった。
    # 미니게임 없이 책상 위 성적표를 둘러보고 대사만 흐른다
    phase1:
      script: report-card-intro

  # ─────────────────────────────────────────────── 1페이즈 · 강도 1 (성적표 뒤)
  - id: console
    icon: GameController
    lore:
      title:
        ko: 이젠 재미없네
        en: Not fun anymore
        ja: もう楽しくない
      phase1:
        ko: 혼자 하는 게임은 이기든 지든 똑같다.
        en: Alone, winning and losing feel the same.
        ja: 一人だと勝っても負けても同じだ。
      phase2:
        ko: 다시 둘이 하면 또 재밌어질까.
        en: Maybe it gets fun again with two.
        ja: 二人ならまた楽しくなるかな。
    # 1차: 주완과의 내기 게임(진입) → 혼자 이긴 판(결과)
    # → 주완과 2P로 하던 때의 회상(console-flashback)
    phase1:
      script: console-intro
      minigame: fighter-duel
      resultScript: console-alone
      unlockAfter: [report-card]
      cutscene: console-flashback
    # 2차: 곁가지 (v4 3-4). 필수 체인에서 빠졌다. 카드 미궁(card-odd)은 v4.1에서 뺐다:
    # 여기 다시 붙이지 말 것.
    phase2:
      script: console-echo
      from: p2
      side: true

  - id: ball
    icon: Baseball
    lore:
      title:
        ko: 혼자 하는 캐치볼
        en: Catch, Alone
        ja: ひとりのキャッチボール
      phase1:
        ko: 전국대회 8강, 은강고전. 내 마지막 타석의 뜬공을 상대 포수가 잡아내며 끝났다. 벽에 던지면 돌아온다. 늘 윤호가 받아 주던 공인데, 받아줄 사람이 없다는 걸 자꾸 잊는다.
        en: Nationals quarterfinal, against Eungang High. It ended when their catcher caught the pop-up from my last at-bat. Throw it at the wall and it comes back. Yunho always used to catch it, and I keep forgetting there's no one here to catch it now.
        ja: 全国大会ベスト8、銀江高戦。俺の最後の打席のフライを、相手のキャッチャーが捕って終わった。壁に投げれば返ってくる。いつもユノが受けてくれた球なのに、受ける人がいないことをつい忘れてしまう。
      phase2:
        ko: 받아줄 사람이 어딘가에 있다면, 이 공은 아직 쓸 데가 있다.
        en: If someone out there can catch it, this ball still has a use.
        ja: 受けてくれる人がどこかにいるなら、このボールにはまだ使い道がある。
    # 1차: 전국대회 8강 회상(재하 복선, 우리 포수 윤호) → 캐치볼 → "받아줄 사람(윤호)이 없다"
    # → 역광 속 은강고 포수의 미트, 윤호를 떠올림(ball-flashback)
    phase1:
      script: ball-intro
      minigame: ball-catch
      resultScript: ball-alone
      unlockAfter: [report-card]
      cutscene: ball-flashback
      replayStill: /assets/images/mg-ball-catch-sunset-field.webp?v=2
    # 2차: 곁가지. 회전 미궁(angle-turn)은 뺐다 (현관 잠금에서도 빠짐): 다시 붙이지 말 것.
    phase2:
      script: ball-echo
      from: p2
      side: true

  # ─────────────────────────────────────────────── 1페이즈 · 강도 2 (강도 1 둘 다 뒤)
  - id: frame
    icon: ImageSquare
    lore:
      title:
        ko: 부모님
        en: My Parents
        ja: 両親
      # 왜 안 보이는지는 적지 않는다. 도해는 본 것만 적는다: 닦았는데도 그 얼굴만
      # 안 보인다. "흐릿하다"처럼 이유를 지어내는 말도 쓰지 않는다.
      phase1:
        ko: 유리에 먼지가 껴서 한참을 닦았다. 다 닦았는데도 두 사람 얼굴만 눈에 들어오지 않는다.
        en: The glass was dusty, so I wiped it for a long time. Even clean, their two faces are the only ones I can't take in.
        ja: ガラスに埃がついていて、長いこと拭いた。拭き終えても、二人の顔だけがどうしても目に入ってこない。
      phase2:
        ko: 못본 지 오래 된 부모님을 열심히 떠올렸다. 다시 마음을 잡고 액자를 세워 두고 나왔다.
        en: I tried hard to picture my parents, whom I haven't seen in so long. Then I pulled myself together, stood the frame back up, and left.
        ja: 長いこと会っていない両親を、必死に思い浮かべた。気持ちを立て直して、写真立てを起こしてから部屋を出た。
    phase1:
      minigame: photo-wipe
      resultScript: frame-photo
      resultMusic: title
      unlockAfter: [console, ball]
      replayStill: /assets/images/mg-photo-wipe-phase-1.webp?v=20260912
    # 2차 (4페이즈): 안방 서류 셋을 다 본 뒤 금빛이 돈다. 조각을 맞추면 얼굴이 돌아온다.
    # 대사는 없다 (v4 3-6). 끝나는 순간 정적 비트(still-beat)가 흐르고 resolve로 넘어간다.
    phase2:
      minigame: photo-puzzle
      from: p4
      unlockAfter: [research-note, id-card]
      cutscene: still-beat
      replayStill: /assets/images/mg-photo-wipe-phase-2.webp?v=20260912

  - id: phone
    icon: DeviceMobile
    lore:
      title:
        ko: 끊긴 연락
        en: The Silence
        ja: 途切れた連絡
      phase1:
        ko: 단톡은 그날 이후로 조용하다.
        en: The group chat has been quiet since that day.
        ja: グループチャットは、あの日から静かなままだ。
      phase2:
        ko: 그날 아침 7시 12분에는 끝나면 바로 집에 오라는 엄마 문자가 와 있었다. 그게 엄마의 마지막 문자다.
        en: At 7:12 that morning, Mom had texted me to come straight home when I was done. That was her last text.
        ja: あの日の朝7時12分、終わったらすぐ帰ってきなさいという母さんのメッセージが届いていた。それが母さんの最後のメッセージだ。
    # 1차: 시끄러운 단톡 → 가족 단톡(부모님 메시지 폭탄 + 도해 "응.") → 결과 대사가
    # "10월 19일"을 못박는다. 엄마 대화방은 여기서 보이지도, 말하지도 않는다
    phase1:
      minigame: phone-chat
      resultScript: phone-stopped
      unlockAfter: [console, ball]
    # 2차 (2페이즈): 1막 내내 미뤄 둔 엄마 대화방을 다시 연다. 그날 이미 읽은 마지막 문자다. 잠금은 없다.
    # 컴퓨터를 기다리는 이유: 캐시 뉴스의 첫 보도 시각(오후)을 먼저 봐야
    # 엄마 문자의 7시 12분이 이상하게 읽힌다 (v4 3-4).
    phase2:
      script: phone-mom-intro
      minigame: mom-chat
      resultScript: phone-mom-read
      resultMusic: title
      from: p2
      unlockAfter: [computer]

  # ─────────────────────────────────────────────── 1페이즈 · 강도 3
  - id: calendar
    icon: CalendarHeart
    lore:
      title:
        ko: 10월 19일
        en: October 19
        ja: 10月19日
      phase1:
        ko: 지나간 날들을 세려고 正자만 그었다.
        en: "To count the days that went by, I just kept making tally marks."
        ja: "過ぎた日を数えようと、正の字だけを書いた。"
    # phone 뒤에만 열린다. 진입 대사가 단톡의 날짜(10월 19일)를 이어받는다.
    phase1:
      script: calendar-intro
      minigame: calendar-flip
      resultScript: calendar-tally
      unlockAfter: [phone]

  - id: window
    icon: GridFour
    lore:
      title:
        ko: 창밖
        en: Outside
        ja: 窓の外
      phase1:
        ko: 커튼을 걷었다. 깨진 유리, 찌그러진 차, 지워지지 않는 자국. 조용하면서 기묘한 풍경에 창문을 다시 닫았다.
        en: I opened the curtain. Broken glass, a crushed car, stains that won't wash off. The view was so quiet and so strange that I closed the window again.
        ja: カーテンを開けた。割れたガラス、潰れた車、消えない跡。静かで奇妙な景色に、また窓を閉めた。
    # 커튼을 걷으면 그림 한 장. 강도 3이라 강도 2 둘(액자·폰)을 다 본 뒤에 열린다.
    phase1:
      minigame: window-view
      resultScript: window-silence
      unlockAfter: [frame, phone]
      replayStill: /assets/images/mg-window-view-outside.webp

  # ─────────────────────────────────────────────── 분기점 · 라디오
  - id: radio
    icon: Radio
    lore:
      title:
        ko: 그날의 방송
        en: That Broadcast
        ja: あの日の放送
      phase1:
        ko: 바깥 현실을 마주하는게 두렵다.
        en: "I'm afraid to face what's really out there."
        ja: "外の現実と向き合うのが怖い。"
      phase2Title:
        ko: 은강고
        en: Eungang High
        ja: 銀江高
      phase2:
        ko: 은강고 체육관에 생존자가 있다고 했다. 나흘 밤까지라... …그 목소리, 어디서 들어봤는데.
        en: They said there are survivors at the Eungang High gym. Four nights, huh... …I've heard that voice somewhere.
        ja: 銀江高の体育館に生存者がいると言っていた。四晩まで、か... …あの声、どこかで聞いたことがある。
    # 1차 (관문): 나머지 일곱을 다 봐야 열린다. 반전은 한 번뿐이라 순서를 강제한다.
    # 진입 대사 → 튜닝 → 글자 맞추기("내가 이 방에 고립된 이유" 답: 좀비, 오답 세 번마다
    # 글자 힌트) → 재난방송(결과 대사) → 이미지 나열 컷씬(store가 radio-blackout을 연다).
    phase1:
      script: radio-intro
      minigame: radio-quiz
      resultScript: radio-broadcast
      unlockAfter: [report-card, console, ball, frame, phone, calendar, window]
    # 2차 (분기점): 빨갛게 깜빡이는 라디오를 누르면 곧장 생존자 방송(3페이지 웹툰)이 흐른다.
    # 튜닝을 두 번 시키지 않는다. 끝나면 방에서 도해의 한마디, 방문에 금빛이 돈다.
    # 수첩 제목은 이 차수부터 "은강고"다 (phase2Title). 1차만 본 동안은 "그날의 방송".
    phase2:
      from: turning
      cutscene: survivor-broadcast

  # ─────────────────────────────────────────────── 2페이즈 · 거실 (순서 자유)
  - id: duffel
    icon: Bag
    lore:
      title:
        ko: 챙길 것들
        en: What to Take
        ja: 持っていくもの
      phase2:
        ko: 가방을 비우고 다시 쌌다. 물, 통조림, 손전등. 글러브는 두고 가려다 다시 넣었다.
        en: I emptied the bag and packed it again. Water, canned food, a flashlight. I almost left the glove behind, then put it back in.
        ja: バッグを空にして詰め直した。水、缶詰、懐中電灯。グローブは置いていこうとして、やっぱり入れた。
    phase2:
      script: duffel-pack
      from: p2

  - id: fridge
    icon: Package
    lore:
      title:
        ko: 채워둔 것들
        en: What They Stocked
        ja: 詰めてあったもの
      phase2:
        ko: 냉장고도 찬장도 아직 음식이 반이 남았다. 한 달을 버틸 만큼의 식량이 왜 평범한 우리 집에 있었을까.
        en: "The fridge and the cupboards are still half full of food. Why did our ordinary home have enough to last a month?"
        ja: "冷蔵庫も戸棚も、まだ食べ物が半分残っている。ひと月もつほどの食料が、どうして普通のうちにあったんだろう。"
    # 위칸만. 아래칸("손대지 마")은 3페이즈의 앰플이다.
    phase2:
      script: fridge-open
      from: p2

  - id: shoes
    icon: Sneaker
    lore:
      title:
        ko: 두고 간 등산화
        en: The Boots They Left
        ja: 置いていった登山靴
      phase2:
        ko: 등산화는 신발장에 그대로다. 가볍게 다녀온다더니, 캐리어는 두 개였다.
        en: The hiking boots are still in the shoe cabinet. They said it'd be a light trip, but they took two suitcases.
        ja: 登山靴は靴箱にそのままだ。軽く行ってくると言っていたのに、スーツケースは二つだった。
    phase2:
      script: shoes-open
      from: p2

  # 식탁 위 엄마 쪽지. id가 cards인 것은 트럼프 판이던 시절의 이름이다: 저장된 진행에
  # 이 id가 남아 있어 바꾸지 않는다 (docs/story.md 2장, 엄마의 흔적)
  - id: cards
    icon: Note
    lore:
      title:
        ko: 식탁 위 쪽지
        en: The Note on the Table
        ja: 食卓のメモ
      phase2:
        ko: '"아래칸 건드리지 마." 식탁 위에 접어 둔 엄마 쪽지가 보인다.'
        en: "\"Don't touch the bottom drawer.\" Mom's folded note is sitting on the table."
        ja: 「下の段は触らないで。」食卓の上に、母さんが折りたたんだメモがある。
    # 접힌 쪽지를 3D로 펼치면 안쪽에 엄마 메모 (card-flip, v4.1 3장)
    phase2:
      script: cards-intro
      minigame: card-flip
      resultScript: cards-memo
      from: p2

  # 컴퓨터: 1페이즈에는 꺼진 배경이다 (누르면 혼잣말 한 줄: RemarkId computer-off).
  # 2차 (2페이즈): 로그인 0812(협탁 쪽지 + 달력 동그라미) → 아빠 메일 + 캐시 뉴스(첫 보도 시각).
  # 3차 (3페이즈): 앰플 라벨의 로고를 쫓아 다시 켠다 → 로고 매칭 → 아빠 메일 속 하부장 힌트.
  - id: computer
    icon: Desktop
    lore:
      title:
        ko: 저장된 것들
        en: What Was Saved
        ja: 保存されていたもの
      phase2:
        ko: 아빠 메일과 뉴스. 연구시설 근처에서 처음 사태가 벌어졌고, 첫 보도는 그날 오후 3시였다.
        en: Dad's emails and the news. It all started near a research facility, and the first report came out at 3 p.m. that day.
        ja: 父さんのメールとニュース。騒ぎは研究施設の近くで始まって、最初の報道はあの日の午後3時だった。
      phase3:
        ko: 앰플 라벨의 로고가 아빠 메일 첨부에 있었다. 하부장은 내 번호로 잠가 뒀다고 했다.
        en: The logo on the ampoule label was in an attachment to Dad's email. He said he'd locked the lower cabinet with my number.
        ja: アンプルのラベルのロゴが、父さんのメールの添付にあった。下の戸棚は俺の番号で鍵をかけておいたと書いてあった。
    phase2:
      script: computer-power-on
      minigame: computer-browse
      resultScript: computer-archive
      from: p2
    phase3:
      script: computer-logo-intro
      minigame: computer-logo
      resultScript: computer-logo-found
      from: p3
      unlockAfter: [ampoule]

  # ─────────────────────────────────────────────── 3페이즈 · 수상한 앰플
  #
  # 냉장고 아래칸("아래칸 건드리지 마" 쪽지). 보냉 케이스를 3D로 돌려 옆면의
  # 빈 슬롯을 보고, 앰플을 꺼내 돌려 라벨의 로고 조각을 본다 (ampoule-case, v4.1 6장).
  # 로고 조각이 방 컴퓨터로 이끈다 (컴퓨터 3차).
  - id: ampoule
    icon: Syringe
    lore:
      title:
        ko: 정체불명의 앰플
        en: An Unmarked Ampoule
        ja: 正体不明のアンプル
      phase2:
        ko: 보냉 케이스에 앰플 하나, 옆 칸은 비어 있었다. 라벨에는 지워진 로고가 반쯤 남아 있다.
        en: One ampoule in the cold case, the slot next to it empty. Half of a faded logo is left on the label.
        ja: 保冷ケースにアンプルが一本、隣の枠は空だった。ラベルには消えかけたロゴが半分残っている。
    phase2:
      script: ampoule-note
      minigame: ampoule-case
      resultScript: ampoule-found
      from: p3

  # ─────────────────────────────────────────────── 4페이즈 · 안방 (순서 자유)
  #
  # 사태 이후 처음 들어가는 공간. 서류 순서 맞추기와 출입증 기울이기를 마치면 "…이게 답일지도
  # 몰라." 한 줄 뒤에 방의 액자가 금빛으로 돈다 (frame 2차). 여행이 아니었다는 소집 공지는
  # v4.1에서 서류 조각 하나로 합쳤다 (not-a-trip 삭제).
  - id: research-note
    icon: FileText
    lore:
      title:
        ko: 연구 일지
        en: Research Log
        ja: 研究日誌
      phase2:
        ko: 날짜순으로 놓은 엄마의 기록. 둘 다 라온 연구원이었고, 앰플은 치료제 후보였다. 여행은 연구소 소집이었다.
        en: Mom's notes, laid out by date. They were both researchers at Raon, and the ampoule was a candidate cure. The trip was a summons to the institute.
        ja: 日付順に並べた母さんの記録。二人ともラオンの研究員で、アンプルは治療薬の候補だった。旅行は研究所からの招集だった。
    phase2:
      script: research-note-intro
      minigame: papers-order
      resultScript: research-note-read
      from: p4

  - id: id-card
    icon: IdentificationCard
    lore:
      title:
        ko: 출입증
        en: Access Badges
        ja: 入館証
      phase2:
        ko: 라온생명과학연구소 출입증. 아빠 이름, 엄마 이름. 사진 위 홀로그램에 앰플 라벨에 남아있던 그 로고가 문득 생각났다.
        en: Raon Life Science Institute access badges. Dad's name, Mom's name. The hologram over the photo suddenly brought back the logo left on the ampoule label.
        ja: ラオン生命科学研究所の入館証。父さんの名前、母さんの名前。写真の上のホログラムを見て、アンプルのラベルに残っていたあのロゴをふと思い出した。
    phase2:
      script: id-card-look
      minigame: id-card-flip
      resultScript: id-card-found
      from: p4
