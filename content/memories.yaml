# 기억 오브젝트: 목록·순서·해금 조건·인터랙션 흐름 (v4 설계서).
#
# 이 파일이 게임 진행의 뼈대다. 여기 적힌 순서가 기억 패널에 뜨는 순서이고,
# unlockAfter와 from이 "무엇을 먼저 해야 열리는가"를 정한다.
#
# 고치고 나면 `pnpm content:build`. 어드민(dev 서버의 /admin)에서 저장하면 자동으로 돈다.
#
# ── 페이즈 (저장하지 않고 진행에서 파생된다: src/data/story-phase.ts) ─────────────
#
#   intro    불 꺼진 방. 스위치를 켜면 p1
#   p1       방 조사. 강도 1 → 2 → 3 → 라디오(관문). 1차 조사(phase1)가 여기 산다
#   turning  라디오 1차를 마친 뒤. 빨간 라디오 → 생존자 방송 → 방문 금빛
#   p2       방문을 연 뒤. 거실 넷 + 컴퓨터 로그인 → 엄마 대화방
#   p3       p2 필수 조사를 다 마치면. 앰플 → 세면대 물 빼기(소독제 병) → 컴퓨터 로고 고르기 → 협탁 서랍(407) → 안방 열쇠
#   p4       안방 문을 연 뒤. 서류 셋 → 액자 2차 → 정적 비트
#   resolve  정적 비트 뒤. 현관 배트 → 문
#   ending   현관문을 연 순간
#
# p2 → p3, p4 → resolve 전이는 그 페이즈의 필수 조사(from이 그 페이즈이고 side가
# 아닌 것)를 전부 마치는 것이다. 협탁 서랍·안방 문은 기억이 아니라 퍼즐·문이라 여기 없다
# (src/data/room-clues.ts의 PUZZLE_IDS, src/data/doors.ts).
#
# 배트는 여기 없다. 현관에 세워진 배트는 모으는 물건이 아니라 resolve에 켜지는
# 트리거다 (layout의 BAT_PLACEMENT, scenes의 EndingTrigger).
#
# ── 한 항목의 형태 ────────────────────────────────────────────────────────────
#   id            기억 id. 코드·에셋·i18n 키가 전부 이 값을 쓴다.
#   icon          기억 패널 아이콘. @phosphor-icons/react 이름 (schema.mjs의 허용 목록).
#   lore          수첩에 남는 기록. 있는 차수(phase1/2/3)마다 하나씩.
#   phase1        1차 조사 (p1).
#   phase2        2차 조사. from이 열리는 페이즈를 정한다.
#   phase3        3차 조사: 2차를 마친 뒤의 되짚기 (지금은 컴퓨터 하나).
#
# 차수 안의 형태:
#   script        미니게임 앞에 트는 진입 대사 (scripts.yaml의 id)
#   minigame      미니게임 id (src/minigames/index.ts 레지스트리)
#   resultScript  미니게임 클리어 뒤의 결과 대사 (scripts.yaml의 id)
#   resultMusic   결과 대사 동안 방 곡 대신 트는 곡. 지금은 `title`(타이틀 곡) 하나.
#                 타이틀에서 들은 곡이 게임 안에서 돌아오는 자리라 아껴 쓴다: 회상이
#                 가장 짙은 두 곳(액자 1차, 엄마의 마지막 문자)에만 건다. 곡이 없는
#                 구간(전환, 안방 p4)에서는 걸어도 들리지 않는다
#   unlockAfter   먼저 끝나야 하는 조사. `radio`는 같은 차수, `computer@3`은 3차
#   from          이 페이즈부터 열린다 (turning/p2/p3/p4). 2차 이후에 필수
#   side          곁가지: true면 페이즈를 넘기는 데 필요 없다
#   cutscene      이 조사를 마치는 순간 트는 컷씬 (cutscenes.yaml의 id)
#   replayStill   다시보기에서 대사 뒤에 세우는 정지 그림 (public 기준 경로). 글자가 언어마다 다른
#                 그림은 파일 이름에 {lng}를 쓴다: ko·en·ja 세 파일이 다 있어야 한다.
#                 아직 비어 있는 칸과 거기에 무엇을 그릴지는 docs/story/replay-stills.md
#
# 대사·미니게임·컷씬이 다 없으면 클릭 즉시 완료된다.

memories:
  # ─────────────────────────────────────────────── 1페이즈 · 강도 0 (문제집 뒤)
  #
  # 야구 회상보다 먼저 "누구의 방인가"를 깐다: 고3, 수능 한 달 전, 부모님.
  # 문제집(이름)을 뒤집은 뒤 가장 먼저 열리는 기억이고, 강도 1(게임기·공)은 이것 뒤에 열린다.
  # 재난의 힌트는 결과 대사 끝 한 줄("…이었나")로만 샌다.
  - id: report-card
    icon: Exam
    lore:
      title:
        ko: 9월 모의고사
        en: September Mock Exam
        ja: 9月の模試
      phase1:
        ko: 점수는 엉망이었다. 엄마는 과외를 알아보자고, 아빠는 괜찮다고 했다.
        en: My scores were a mess. Mom said to look for a tutor. Dad said it was fine.
        ja: 点数はひどかった。母さんは家庭教師を探そうと、父さんは大丈夫だと言った。
    # 미니게임 없이 책상 위 성적표를 둘러보고 대사만 흐른다
    phase1:
      script: report-card-intro
      replayStill: /assets/images/still-report-card.webp

  # ─────────────────────────────────────────────── 1페이즈 · 강도 1 (성적표 뒤)
  - id: console
    icon: GameController
    lore:
      title:
        ko: 이젠 재미없네
        en: Not fun anymore
        ja: もう楽しくない
      phase1:
        ko: 혼자 하는 게임은 이기든 지든 똑같다.
        en: Alone, winning and losing feel the same.
        ja: 一人だと勝っても負けても同じだ。
      phase2:
        ko: 다시 둘이 하면 또 재밌어질까.
        en: Maybe it gets fun again with two.
        ja: 二人ならまた楽しくなるかな。
    # 1차: 주완과의 내기 게임(진입) → 혼자 이긴 판(결과)
    # → 주완과 2P로 하던 때의 회상(console-flashback)
    phase1:
      script: console-intro
      minigame: fighter-duel
      resultScript: console-alone
      unlockAfter: [report-card]
      cutscene: console-flashback
      replayStill: /assets/images/mg-cutscene-console-flashback.webp?v=2
    # 2차: 곁가지 (v4 3-4). 필수 체인에서 빠졌다. 카드 미궁(card-odd)은 v4.1에서 뺐다:
    # 여기 다시 붙이지 말 것.
    phase2:
      script: console-echo
      from: p2
      side: true
      replayStill: /assets/images/mg-cutscene-console-flashback.webp?v=2

  - id: ball
    icon: Baseball
    lore:
      title:
        ko: 혼자 하는 스윙
        en: Swinging Alone
        ja: ひとりのバッティング
      phase1:
        ko: 혼자 휘두르는 배트. 그때 같이 뛰던 애들은 지금 뭘 하고 있을까.
        en: Swinging the bat alone. I wonder what the guys I played with are doing now.
        ja: 一人で振るバット。あの頃一緒にやっていた連中は、今ごろ何をしているんだろう。
      phase2:
        ko: 휘두르는 감각을 잊고 있었다. 다시 칠 날이 올까.
        en: I'd forgotten what a swing feels like. Will I ever get to swing again?
        ja: 振る感覚を忘れていた。また打てる日が来るのかな。
    # 1차: 전국대회 16강 회상(재하 복선, 대기 타석의 윤호) → 스윙 → "혼자 휘둘러도 그때 같지 않다"
    # → 역광 속 은강고 포수의 미트, 그 타석의 끝, 같이 뛴 친구들을 떠올림(ball-flashback)
    phase1:
      script: ball-intro
      minigame: ball-catch
      resultScript: ball-alone
      unlockAfter: [report-card]
      cutscene: ball-flashback
      replayStill: /assets/images/mg-ball-catch-sunset-field.webp?v=2
    # 2차: 곁가지. 회전 미궁(angle-turn)은 뺐다 (현관 잠금에서도 빠짐): 다시 붙이지 말 것.
    phase2:
      script: ball-echo
      from: p2
      side: true
      replayStill: /assets/images/mg-ball-catch-sunset-field.webp?v=2

  # ─────────────────────────────────────────────── 1페이즈 · 강도 2 (강도 1 둘 다 뒤)
  - id: frame
    icon: ImageSquare
    lore:
      title:
        ko: 부모님
        en: My Parents
        ja: 両親
      # 왜 안 보이는지는 적지 않는다. 도해는 본 것만 적는다: 닦았는데도 그 얼굴만
      # 안 보인다. "흐릿하다"처럼 이유를 지어내는 말도 쓰지 않는다.
      phase1:
        ko: 다 닦았는데도 두 사람 얼굴만 보이지 않는다.
        en: I wiped it clean, and still theirs are the only faces I can't see.
        ja: 拭き終えても、二人の顔だけが見えない。
      phase2:
        ko: 부모님 얼굴을 떠올리고, 액자를 다시 세워 두었다.
        en: I pictured my parents' faces and stood the frame back up.
        ja: 両親の顔を思い浮かべて、写真立てを起こした。
    phase1:
      minigame: photo-wipe
      resultScript: frame-photo
      resultMusic: title
      unlockAfter: [console, ball]
      replayStill: /assets/images/mg-photo-wipe-phase-1.webp?v=20260912
    # 2차 (4페이즈): 안방 서류 셋을 다 본 뒤 금빛이 돈다. 조각을 맞추면 얼굴이 돌아온다.
    # 대사는 없다 (v4 3-6). 끝나는 순간 정적 비트(still-beat)가 흐르고 resolve로 넘어간다.
    phase2:
      minigame: photo-puzzle
      from: p4
      unlockAfter: [research-note, id-card]
      cutscene: still-beat
      replayStill: /assets/images/mg-photo-wipe-phase-2.webp?v=20260912

  - id: phone
    icon: DeviceMobile
    lore:
      title:
        ko: 끊긴 연락
        en: The Silence
        ja: 途切れた連絡
      phase1:
        ko: 단톡은 그 전날 밤에 멈췄다. 그날 건 전화는 아무도 받지 않았다.
        en: The group chat stopped the night before. No one picked up the calls I made that day.
        ja: グループチャットは前の晩で止まった。あの日かけた電話には、誰も出なかった。
      phase2:
        ko: 아침 7시 12분, 바로 집에 오라던 엄마의 마지막 문자.
        en: "7:12 a.m. Mom's last text: come straight home."
        ja: 朝7時12分、すぐ帰ってきなさいという母さんの最後のメッセージ。
    # 1차: 시끄러운 단톡 → 가족 단톡(부모님 메시지 폭탄 + 도해 "응.") → 결과 대사가
    # 단톡의 마지막(10월 18일 밤)과 받지 않은 전화(19일)를 못박는다. 엄마 대화방은 여기서 보이지도, 말하지도 않는다
    phase1:
      minigame: phone-chat
      resultScript: phone-stopped
      unlockAfter: [console, ball]
      replayStill: /assets/images/still-phone.webp?v=2
    # 2차 (2페이즈): 1막 내내 미뤄 둔 엄마 대화방을 다시 연다. 그날 이미 읽은 마지막 문자다. 잠금은 없다.
    # 컴퓨터를 기다리는 이유: 캐시 뉴스의 첫 보도 시각(오후)을 먼저 봐야
    # 엄마 문자의 7시 12분이 이상하게 읽힌다 (v4 3-4).
    phase2:
      script: phone-mom-intro
      minigame: mom-chat
      resultScript: phone-mom-read
      resultMusic: title
      from: p2
      unlockAfter: [computer]
      replayStill: /assets/images/still-phone.webp?v=2

  # ─────────────────────────────────────────────── 1페이즈 · 강도 3
  - id: calendar
    icon: CalendarHeart
    lore:
      title:
        ko: 10월 19일
        en: October 19
        ja: 10月19日
      phase1:
        ko: 지나간 날을 正자로 세다가 그만뒀다.
        en: "I was counting the days with tally marks, then I stopped."
        ja: "過ぎた日を正の字で数えていたが、やめた。"
    # phone 뒤에만 열린다. 진입 대사가 폰 결과 대사의 날짜(전화가 닿지 않은 10월 19일)를 이어받는다.
    phase1:
      script: calendar-intro
      minigame: calendar-flip
      resultScript: calendar-tally
      unlockAfter: [phone]
      replayStill: /assets/images/mg-calendar-flip-11.webp

  - id: window
    icon: GridFour
    lore:
      title:
        ko: 창밖
        en: Outside
        ja: 窓の外
      phase1:
        ko: 멀리 연기, 도로의 자국, 불 꺼진 창들. 커튼을 다시 닫았다.
        en: Smoke in the distance, a stain on the road, dark windows. I closed the curtains again.
        ja: 遠くの煙、道路の染み、明かりの消えた窓。またカーテンを閉めた。
    # 커튼을 걷으면 그림 한 장. 강도 3이라 강도 2 둘(액자·폰)을 다 본 뒤에 열린다.
    phase1:
      minigame: window-view
      resultScript: window-silence
      unlockAfter: [frame, phone]
      replayStill: /assets/images/mg-window-view-outside.webp

  # ─────────────────────────────────────────────── 분기점 · 라디오
  - id: radio
    icon: Radio
    lore:
      title:
        ko: 그날의 방송
        en: That Broadcast
        ja: あの日の放送
      phase1:
        ko: 바깥 현실을 마주하는 게 두렵다.
        en: "I'm afraid to face what's really out there."
        ja: "外の現実と向き合うのが怖い。"
      phase2Title:
        ko: 은강고
        en: Eungang High
        ja: 銀江高
      phase2:
        ko: 은강고 체육관에 생존자가 있다. 나흘 밤 뒤에 떠난다고 했다. 어디서 들어 본 목소리다.
        en: Survivors at the Eungang High gym. They leave after four nights. I've heard that voice somewhere.
        ja: 銀江高の体育館に生存者がいる。四日後の夜に出ると言っていた。どこかで聞いたことのある声だ。
    # 1차 (관문): 나머지 일곱을 다 봐야 열린다. 반전은 한 번뿐이라 순서를 강제한다.
    # 진입 대사 → 튜닝 → 라디오가 꺼지고 재난방송이 떠오르는 컷씬(store가 radio-blackout을
    # 연다). 방송과 그날의 이미지 나열은 전부 그 컷씬 안에 있다.
    phase1:
      script: radio-intro
      minigame: frequency-tune
      unlockAfter: [report-card, console, ball, frame, phone, calendar, window]
      replayStill: /assets/images/cutscene-day-8.webp
    # 2차 (분기점): 빨갛게 깜빡이는 라디오를 누르면 곧장 생존자 방송(3페이지 웹툰)이 흐른다.
    # 튜닝을 두 번 시키지 않는다. 끝나면 방에서 도해의 한마디, 방문에 금빛이 돈다.
    # 수첩 제목은 이 차수부터 "은강고"다 (phase2Title). 1차만 본 동안은 "그날의 방송".
    phase2:
      from: turning
      cutscene: survivor-broadcast
      replayStill: /assets/images/cutscene-survivor-1.webp?v=2

  # ─────────────────────────────────────────────── 2페이즈 · 거실 (순서 자유)
  - id: duffel
    icon: Bag
    lore:
      title:
        ko: 챙길 것들
        en: What to Take
        ja: 持っていくもの
      phase2:
        ko: 가방을 다시 쌌다. 글러브는 두려다 도로 넣었다.
        en: I repacked the bag. Almost left the glove, then put it back in.
        ja: バッグを詰め直した。グローブは置いていこうとして、やっぱり入れた。
      phase3:
        ko: 싸 둔 가방을 멨다. 글러브도 들어 있다.
        en: I shouldered the packed bag. The glove is in it.
        ja: 詰めておいたバッグを背負った。グローブも入っている。
    phase2:
      script: duffel-pack
      from: p2
      replayStill: /assets/images/still-duffel.webp
    # 떠나기 전 챙길 것 셋 중 하나 (배트·앰플과 함께, 순서 자유). 셋을 다 챙겨야 현관문이 빛난다
    phase3:
      script: duffel-take
      from: resolve
      replayStill: /assets/images/still-duffel.webp

  - id: fridge
    icon: Package
    lore:
      title:
        ko: 채워 둔 것들
        en: What They Stocked
        ja: 詰めてあったもの
      phase2:
        ko: 한 달을 먹고도 며칠 치가 남았다. 2박 3일에 왜 이만큼을.
        en: "A month of eating, and a few days' worth is still left. Why this much for two nights?"
        ja: "ひと月食べても数日分残っている。二泊三日に、なぜこんなに。"
    # 위칸만. 아래칸("손대지 마")은 3페이즈의 앰플이다.
    phase2:
      script: fridge-open
      from: p2
      replayStill: /assets/images/still-fridge.webp

  - id: shoes
    icon: Sneaker
    lore:
      title:
        ko: 두고 간 등산화
        en: The Boots They Left
        ja: 置いていった登山靴
      phase2:
        ko: 등산화는 그대로인데, 캐리어는 두 개였다.
        en: The hiking boots are still here, but they took two suitcases.
        ja: 登山靴はそのままなのに、スーツケースは二つだった。
    phase2:
      script: shoes-open
      from: p2
      replayStill: /assets/images/still-shoes.webp

  # 식탁 위 엄마 쪽지. id가 cards인 것은 트럼프 판이던 시절의 이름이다: 저장된 진행에
  # 이 id가 남아 있어 바꾸지 않는다 (docs/story/story.md 2장, 엄마의 흔적)
  - id: cards
    icon: Note
    lore:
      title:
        ko: 식탁 위 쪽지
        en: The Note on the Table
        ja: 食卓のメモ
      phase2:
        ko: '"아래칸. RX ||" 식탁 위 엄마 쪽지.'
        en: "\"Bottom drawer. RX ||\" Mom's note on the table."
        ja: 「下の段。RX ||」食卓の上の母さんのメモ。
    # 접힌 쪽지를 3D로 펼치면 안쪽에 엄마 메모 (card-flip, v4.1 3장)
    phase2:
      script: cards-intro
      minigame: card-flip
      resultScript: cards-memo
      from: p2
      replayStill: /assets/images/still-cards-{lng}.webp

  # 컴퓨터: 1페이즈에는 꺼진 배경이다 (누르면 혼잣말 한 줄: RemarkId computer-off).
  # 2차 (2페이즈): 로그인 0812(로그인 화면의 힌트 + 달력 동그라미) → 아빠 메일 + 캐시 뉴스(첫 보도 시각).
  # 3차 (3페이즈): 세면대 바닥의 손 소독제 병(단서 laon-sanitizer)에서 로고를 본 뒤 다시 켠다 → 라온 로고 고르기
  #   → 아빠가 접속했던 임직원 포털의 메모(선반의 책 힌트). 소독제 병을 보기 전에는 열리지 않는다 (src/data/room-clues.ts의 VISIT_AFTER_DISCOVERY).
  - id: computer
    icon: Desktop
    lore:
      title:
        ko: 저장된 것들
        en: What Was Saved
        ja: 保存されていたもの
      phase2:
        ko: 사태는 연구시설 근처에서 시작됐다. 첫 보도는 오후 3시.
        en: "It started near a research facility. First report: 3 p.m."
        ja: 騒ぎは研究施設の近くで始まった。最初の報道は午後3時。
      phase3:
        ko: 떠나기 전날 밤, 아빠가 이 컴퓨터로 라온에 접속했다. 내 방에 있었다.
        en: "The night before they left, Dad signed in to Laon from this computer. He was in my room."
        ja: 出発の前の晩、父さんはこのパソコンでラオンに接続していた。俺の部屋にいたんだ。
    phase2:
      script: computer-power-on
      minigame: computer-browse
      resultScript: computer-archive
      from: p2
      replayStill: /assets/images/still-computer.webp
    phase3:
      script: computer-logo-intro
      minigame: computer-logo
      resultScript: computer-logo-found
      from: p3
      # 앰플의 3페이즈 조사(2차) 뒤. 차수를 못박는다: 앰플에는 떠나기 전 3차가 있어서
      # 그냥 [ampoule]이면 같은 차수(3차)로 읽혀 3페이즈가 막힌다
      unlockAfter: [ampoule@2]
      replayStill: /assets/images/still-computer.webp

  # ─────────────────────────────────────────────── 3페이즈 · 수상한 앰플
  #
  # 냉장고 아래칸("아래칸. RX ||" 쪽지: 두 줄은 앰플 두 개, 하나는 빈 슬롯). 보냉 케이스를 3D로 돌려 옆면의
  # 빈 슬롯을 보고, 앰플을 꺼내 돌려 라벨의 로고 조각을 본다 (ampoule-case, v4.1 6장).
  # 로고 조각은 화장실 세면대의 물을 빼면 나오는 손 소독제 병(라벨에 같은 로고가 있다)과 이어지고, 그 로고가 방 컴퓨터로 이끈다 (컴퓨터 3차).
  - id: ampoule
    icon: Syringe
    lore:
      title:
        ko: 정체불명의 앰플
        en: A Mysterious Ampoule
        ja: 正体不明のアンプル
      phase2:
        ko: 케이스에 앰플 하나, 옆 칸은 비었다. 라벨엔 반쯤 지워진 로고.
        en: One ampoule in the case, the next slot empty. A half-worn logo on the label.
        ja: ケースにアンプルが一本、隣は空。ラベルには半分消えたロゴ。
      phase3:
        ko: 앰플을 챙겼다. 치료제일지도 모르는 하나.
        en: I took the ampoule. The one that might be a cure.
        ja: アンプルを持った。治療薬かもしれない一本。
    phase2:
      script: ampoule-note
      minigame: ampoule-case
      resultScript: ampoule-found
      from: p3
      replayStill: /assets/images/still-ampoule-vial.webp
    # 3페이즈에 들여다보고 내려놓았던 앰플을, 떠나기 전에 서랍에서 집어 든다 (ampoule-pickup:
    # 씬 안에서 서랍이 밀려 나오고 앰플이 손에 들린다). 챙길 것 셋 중 하나
    phase3:
      script: ampoule-take
      minigame: ampoule-pickup
      resultScript: ampoule-taken
      from: resolve
      replayStill: /assets/images/still-ampoule.webp

  # ─────────────────────────────────────────────── 4페이즈 · 안방 (순서 자유)
  #
  # 사태 이후 처음 들어가는 공간. 서류 순서 맞추기와 출입증 기울이기를 마치면 "…이게 답일지도
  # 몰라." 한 줄 뒤에 방의 액자가 금빛으로 돈다 (frame 2차). 여행이 아니었다는 소집 공지는
  # v4.1에서 서류 조각 하나로 합쳤다 (not-a-trip 삭제).
  - id: research-note
    icon: FileText
    lore:
      title:
        ko: 연구 일지
        en: Research Log
        ja: 研究日誌
      phase2:
        ko: 두 분의 연구는 이거였다. 앰플은 치료제 후보, 여행은 소집.
        en: "This was their research. The ampoule: a candidate cure. The trip: a summons."
        ja: 二人の研究はこれだった。アンプルは治療薬の候補、旅行は招集。
    phase2:
      script: research-note-intro
      minigame: papers-order
      resultScript: research-note-read
      from: p4
      replayStill: /assets/images/still-research-note.webp

  - id: id-card
    icon: IdentificationCard
    lore:
      title:
        ko: 출입증
        en: Access Badges
        ja: 入館証
      phase2:
        ko: 라온 출입증. 홀로그램에 앰플 라벨의 그 로고가 있다.
        en: Laon access badges. The hologram bears the logo from the ampoule label.
        ja: ラオンの入館証。ホログラムにアンプルのラベルのあのロゴがある。
    phase2:
      script: id-card-look
      minigame: id-card-flip
      resultScript: id-card-found
      from: p4
      replayStill: /assets/images/still-id-card-{lng}.webp
