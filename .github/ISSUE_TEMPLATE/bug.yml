name: 버그 리포트
description: 게임이 의도대로 동작하지 않을 때
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요
      placeholder: 액자를 닦다가 대사창이 안 넘어감
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 환경
      description: 브라우저 · OS · 기기 (모바일이면 기종)
      placeholder: Chrome 141 / macOS 15 / M2 Air
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 어디쯤
      options:
        - 3D 씬 / 카메라
        - 대사창 · 선택지 등 UI
        - 미니게임
        - 오디오
        - 다국어 텍스트
        - 모르겠음
    validations:
      required: true
