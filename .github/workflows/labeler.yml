name: Labeler

# pull_request_target: 포크에서 온 PR에도 라벨을 붙일 수 있게. 이 워크플로는
# PR 코드를 체크아웃하거나 실행하지 않으므로 fork 코드가 실행될 여지는 없다.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: path & size labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Path labels
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Size label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });

            // 잠금 파일과 바이너리 에셋은 사람이 리뷰하는 분량이 아니므로 제외한다.
            const ignored = (f) =>
              f.filename === "pnpm-lock.yaml" || f.filename.startsWith("public/assets/");

            const changed = files
              .filter((f) => !ignored(f))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);

            const buckets = [
              ["size/XS", 10],
              ["size/S", 50],
              ["size/M", 200],
              ["size/L", 600],
              ["size/XL", Number.POSITIVE_INFINITY],
            ];
            const target = buckets.find(([, max]) => changed <= max)[0];

            const current = context.payload.pull_request.labels.map((l) => l.name);
            for (const [name] of buckets) {
              if (name !== target && current.includes(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
              }
            }
            if (!current.includes(target)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: [target],
              });
            }

            core.info(`${changed} lines changed (lockfile/assets 제외) → ${target}`);
