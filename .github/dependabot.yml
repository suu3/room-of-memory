version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - "type: deps"
    groups:
      # 3D 스택은 버전이 서로 엮여 있어서 따로 올리면 깨진다. 한 PR로 묶는다.
      three:
        patterns:
          - three
          - "@types/three"
          - "@react-three/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - next
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - "type: config"
