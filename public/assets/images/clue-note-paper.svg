<!--
  서랍에서 꺼낸 쪽지 한 장 — 글씨는 없고 종이만 있는 판이다.
  본문은 i18n을 타야 해서 DOM이 위에 얹는다 (ClueOverlay의 FoldedNote).

  색은 DESIGN.md 토큰 값 그대로다: paper #EFE7D6, bone #D8D0C2, ink #20222A.
  하드코딩한 새 색이 아니라 토큰의 사본이므로, 토큰이 바뀌면 여기도 같이 고칠 것.

  viewBox 640x400 안에서 그리고 배경으로 늘려 쓴다. 찢긴 윗변과 접힌 자국은
  세로로만 늘어나므로 판의 비율이 크게 어긋나지 않는 한 모양이 유지된다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="none" role="presentation">
  <defs>
    <!-- 종이 안쪽이 바깥보다 아주 조금 밝다 — 평평한 색판으로 안 보이게 -->
    <radialGradient id="sheet" cx="42%" cy="28%" r="86%">
      <stop offset="0%" stop-color="#F3EDE0" />
      <stop offset="62%" stop-color="#EFE7D6" />
      <stop offset="100%" stop-color="#E7E0CF" />
    </radialGradient>

    <!-- 접힌 자국. 위쪽은 그늘, 아래쪽은 빛 — 한 번 접었다 편 종이의 단면 -->
    <linearGradient id="crease" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20222A" stop-opacity="0" />
      <stop offset="45%" stop-color="#20222A" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#20222A" stop-opacity="0" />
    </linearGradient>

    <!-- 종이 결. 아주 옅어야 한다 — 눈에 띄면 무늬지 결이 아니다 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06" />
      </feComponentTransfer>
    </filter>

    <filter id="lift" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#20222A" flood-opacity="0.34" />
    </filter>

    <!--
      종이의 윤곽. 윗변은 노트에서 뜯어낸 자리라 톱니처럼 찢겨 있고, 나머지 세 변은
      가위로 자른 듯 곧되 미세하게 흔들린다.
    -->
    <clipPath id="sheetShape">
      <path d="M14,30 L46,20 L78,31 L110,19 L142,30 L176,18 L208,29 L240,19 L274,30 L306,20
               L338,31 L370,19 L404,29 L436,20 L468,30 L500,19 L534,30 L566,21 L598,30 L626,22
               L628,378 L600,386 L318,382 L36,387 L12,378 Z" />
    </clipPath>
  </defs>

  <g filter="url(#lift)">
    <g clip-path="url(#sheetShape)">
      <rect width="640" height="400" fill="url(#sheet)" />
      <rect width="640" height="400" filter="url(#grain)" />

      <!-- 접힌 자국 하나 — 서랍에 반으로 접어 넣어둔 종이 -->
      <rect x="0" y="244" width="640" height="18" fill="url(#crease)" />

      <!-- 찢긴 윗변 바로 아래의 그늘. 뜯긴 결이 두께로 읽히게 한다 -->
      <path d="M14,30 L46,20 L78,31 L110,19 L142,30 L176,18 L208,29 L240,19 L274,30 L306,20
               L338,31 L370,19 L404,29 L436,20 L468,30 L500,19 L534,30 L566,21 L598,30 L626,22
               L626,40 L14,46 Z"
            fill="#20222A" opacity="0.07" />

      <!-- 왼쪽 여백선. 메모지의 인상을 만드는 최소한의 인쇄 -->
      <line x1="66" y1="26" x2="66" y2="384" stroke="#D8D0C2" stroke-width="2" />
    </g>
  </g>
</svg>
