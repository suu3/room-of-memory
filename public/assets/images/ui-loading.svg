<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="loading">
  <style>
    .ring { transform-origin: 60px 60px; }
    .spin { animation: spin 2.4s linear infinite; }
    .spin-back { animation: spin 3.6s linear infinite reverse; }
    .core { animation: breathe 1.8s ease-in-out infinite; transform-origin: 60px 60px; }
    .dot { animation: fade 1.5s ease-in-out infinite; }
    .dot:nth-of-type(2) { animation-delay: 0.25s; }
    .dot:nth-of-type(3) { animation-delay: 0.5s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.35; transform: scale(0.82); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes fade { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .spin, .spin-back, .core, .dot { animation: none; }
      .core { opacity: 0.8; }
    }
  </style>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#20222a" stroke-width="6" opacity="0.55" />
  <g class="ring spin">
    <circle cx="60" cy="60" r="44" fill="none" stroke="#b89a5e" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="52 224" />
  </g>
  <g class="ring spin-back">
    <circle cx="60" cy="60" r="31" fill="none" stroke="#9e5244" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="10 26" opacity="0.85" />
  </g>
  <circle class="core" cx="60" cy="60" r="10" fill="#efe7d6" />
  <g fill="#b89a5e">
    <circle class="dot" cx="47" cy="108" r="3.5" />
    <circle class="dot" cx="60" cy="108" r="3.5" />
    <circle class="dot" cx="73" cy="108" r="3.5" />
  </g>
</svg>
