<!doctype html>
<!--
  오프라인 페이지: 연결이 끊긴 채 캐시에 없는 주소를 열면 서비스 워커(sw.js)가 이 파일을
  대신 돌려준다. 브라우저 공룡 화면 대신 앱 안의 LoadError와 같은 말을 한다.

  Next 빌드 바깥의 정적 파일이라 Tailwind·i18n을 못 쓴다. 색은 DESIGN.md 토큰 값을
  그대로 옮겨 적고, 문구는 common.json의 loadError.*와 맞춘다 (고치면 둘 다).
  주소창에는 원래 열려던 주소가 남아 있으므로 새로고침이 곧 원래 페이지 다시 열기다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1320" />
    <title>기억의 방</title>
    <style>
      @font-face {
        font-family: "Galmuri14";
        src: url("/assets/fonts/Galmuri14.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        /* DESIGN.md > colors */
        --night: #0b1320;
        --ivory: #e9e3d7;
        --fog: #b8c1cd;
        --memory: #d5ae78;
        --line: color-mix(in srgb, #d3deec 14%, transparent);
        --dust: color-mix(in srgb, var(--ivory) 30%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--night);
        color: var(--ivory);
        font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 64px 24px;
        /* 타이틀 화면의 떠오르는 먼지를 멈춘 한 장으로 */
        background-image:
          radial-gradient(circle at 12% 18%, var(--dust) 0 1.5px, transparent 2px),
          radial-gradient(circle at 71% 34%, var(--dust) 0 1px, transparent 1.5px),
          radial-gradient(circle at 43% 77%, var(--dust) 0 2px, transparent 2.5px),
          radial-gradient(circle at 88% 63%, var(--dust) 0 1px, transparent 1.5px);
        background-size: 37vmax 31vmax;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 28rem;
        text-align: center;
        word-break: keep-all;
      }
      h1 {
        margin: 0;
        font-family: "Galmuri14", system-ui, sans-serif;
        font-size: 2.625rem;
        font-weight: 400;
        line-height: 1.15;
        /* globals.css의 .title-logo: 한 픽셀씩 겹쳐 찍어 획을 두껍게 */
        --title-pixel: calc(1em / 14);
        text-shadow:
          var(--title-pixel) 0 0 currentcolor,
          0 var(--title-pixel) 0 currentcolor,
          var(--title-pixel) var(--title-pixel) 0 currentcolor,
          0 2px 6px rgb(5 10 18 / 0.7),
          0 0 40px color-mix(in srgb, var(--memory) 16%, transparent);
      }
      p {
        margin: 4px 0 0;
        color: var(--fog);
        font-size: 14px;
        line-height: 1.5;
        text-wrap: pretty;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--fog);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        text-decoration: none;
        cursor: pointer;
        transition: color 150ms, border-color 150ms;
      }
      .button:hover {
        color: var(--ivory);
      }
      .button.primary {
        border-color: var(--memory);
        background: var(--memory);
        color: var(--night);
      }
      .button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .button:focus-visible {
        outline: 2px solid var(--memory);
        outline-offset: 2px;
      }
      @media (min-width: 768px) {
        h1 {
          font-size: 3.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="alert">
        <h1 id="title">연결이 끊겼어요</h1>
        <p id="body">방이 잠시 멀어졌어요. 인터넷이 돌아오면 저절로 다시 열립니다.</p>
        <div class="actions">
          <button id="retry" type="button" class="button primary" disabled>연결을 기다리는 중</button>
          <a id="home" href="/" class="button">방으로 돌아가기</a>
        </div>
      </div>
    </main>
    <script>
      (() => {
        const TEXT = {
          ko: {
            title: "연결이 끊겼어요",
            body: "방이 잠시 멀어졌어요. 인터넷이 돌아오면 저절로 다시 열립니다.",
            retry: "다시 시도",
            waiting: "연결을 기다리는 중",
            home: "방으로 돌아가기",
            doc: "기억의 방",
          },
          en: {
            title: "Connection lost",
            body: "The room drifted away for a moment. It will open again on its own once you're back online.",
            retry: "Try again",
            waiting: "Waiting for connection",
            home: "Back to the room",
            doc: "Room of Memory",
          },
          ja: {
            title: "接続が切れました",
            body: "部屋が少し遠ざかりました。インターネットが戻ると自動でまた開きます。",
            retry: "再試行",
            waiting: "接続を待っています",
            home: "部屋に戻る",
            doc: "記憶の部屋",
          },
        };

        // 게임에서 고른 언어 (zustand persist: src/store/settings.ts의 "rom-settings")
        let locale = "ko";
        try {
          const saved = JSON.parse(localStorage.getItem("rom-settings") || "null");
          if (saved && saved.state && TEXT[saved.state.locale]) locale = saved.state.locale;
        } catch {}
        const text = TEXT[locale];
        document.documentElement.lang = locale;
        document.title = text.doc;
        document.getElementById("title").textContent = text.title;
        document.getElementById("body").textContent = text.body;
        document.getElementById("home").textContent = text.home;

        const retry = document.getElementById("retry");
        const sync = () => {
          retry.disabled = !navigator.onLine;
          retry.textContent = navigator.onLine ? text.retry : text.waiting;
        };
        retry.addEventListener("click", () => location.reload());
        window.addEventListener("offline", sync);
        // 연결이 돌아오면 원래 열려던 주소를 스스로 다시 연다
        window.addEventListener("online", () => location.reload());
        sync();
      })();
    </script>
  </body>
</html>
